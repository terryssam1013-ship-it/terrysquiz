<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문마중 Level 2 — Chapter 02 리뷰 테스트</title>
<style>
:root{--green:#1a7350;--gl:#e1f5ee;--gd:#0f6e56;--red:#a32d2d;--rl:#faece7;--blue:#2563eb;--bl:#dbeafe;--bg:#f4f6f4;--card:#fff;--txt:#1a1a1a;--muted:#6b7280;--border:rgba(0,0,0,.1);--r:12px;--rs:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding:1rem}
.wrap{max-width:700px;margin:0 auto}
.screen{display:none}.screen.active{display:block}

/* Header */
.hdr{background:var(--green);color:#fff;border-radius:var(--r);padding:1.25rem 1.5rem;margin-bottom:1rem}
.hdr-sub{font-size:12px;opacity:.75;margin-bottom:3px}
.hdr-title{font-size:20px;font-weight:700}
.hdr-row{display:flex;align-items:center;justify-content:space-between}

/* Card */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;margin-bottom:.75rem}

/* Form */
label{font-size:14px;font-weight:500;display:block;margin-bottom:6px}
input[type=text],input[type=password]{width:100%;padding:11px 14px;font-size:15px;border:1px solid var(--border);border-radius:var(--rs);background:#fff;color:var(--txt);margin-bottom:14px}
input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(26,115,80,.12)}

/* Buttons */
.btn{display:block;width:100%;padding:12px;font-size:15px;font-weight:600;border-radius:var(--rs);border:none;cursor:pointer;transition:all .15s}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:var(--gd)}
.btn-outline{background:#fff;color:var(--muted);border:1px solid var(--border);margin-top:8px;font-weight:500}
.btn-outline:hover{background:#f9fafb}
.btn-sm{padding:6px 13px;font-size:12px;width:auto;display:inline-block;border-radius:var(--rs);border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;cursor:pointer}

/* Info boxes */
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.25rem}
.info-box{background:var(--gl);border-radius:var(--rs);padding:.75rem;text-align:center}
.info-n{font-size:20px;font-weight:700;color:var(--green)}
.info-l{font-size:11px;color:var(--gd);margin-top:2px}

/* Progress */
.prog-wrap{margin-bottom:1.25rem}
.prog-bar{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin:5px 0 3px}
.prog-fill{height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.prog-fill.sa-fill{background:var(--blue)}
.prog-info{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* Badge */
.q-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:10px}
.badge-a{background:var(--gl);color:var(--gd)}
.badge-b{background:var(--bl);color:#1d4ed8}
.badge-c{background:#fef3c7;color:#92400e}
.badge-sa{background:#f3e8ff;color:#7e22ce}
.q-point{font-size:11px;color:var(--muted);margin-bottom:8px}
.q-pts{display:inline-block;font-size:11px;font-weight:700;background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:20px;margin-left:6px}
.q-text{font-size:15px;line-height:1.8;margin-bottom:1.25rem}
.blank{display:inline-block;border-bottom:2.5px solid var(--green);min-width:72px;text-align:center;color:var(--green);font-weight:600;padding:0 4px}

/* Choices */
.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:1.25rem}
.choice{text-align:left;padding:11px 14px;border:1px solid var(--border);border-radius:var(--rs);background:#fff;color:var(--txt);cursor:pointer;font-size:14px;line-height:1.6;transition:all .15s}
.choice:hover{border-color:var(--green);background:var(--gl)}
.choice.sel{border-color:var(--green);background:var(--gl);color:var(--gd);font-weight:500}

/* SA Input */
.sa-input-wrap{margin-bottom:1.25rem}
.sa-input-label{font-size:13px;color:var(--muted);margin-bottom:6px}
.sa-input{width:100%;padding:12px 14px;font-size:15px;border:1.5px solid var(--border);border-radius:var(--rs);background:#fff;color:var(--txt)}
.sa-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}

/* Nav */
.nav{display:flex;gap:8px}
.nav-btn{flex:1;padding:11px;border-radius:var(--rs);font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#f9fafb;color:var(--muted);transition:all .15s}
.nav-btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.nav-btn:hover:not(:disabled){opacity:.85}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}

/* Score */
.score-wrap{text-align:center;padding:1.5rem 0 1rem}
.score-ring{width:130px;height:130px;border-radius:50%;background:var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 1rem;color:#fff}
.score-num{font-size:42px;font-weight:700;line-height:1}
.score-tot{font-size:14px;opacity:.75;margin-top:2px}
.score-grade{font-size:22px;font-weight:700;color:var(--green);margin-bottom:4px}
.score-msg{font-size:13px;color:var(--muted)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:.75rem 0}
.stat{background:#f9fafb;border-radius:var(--rs);padding:.75rem;text-align:center;border:1px solid var(--border)}
.stat-n{font-size:22px;font-weight:700;color:var(--green)}
.stat-n.red{color:var(--red)}
.stat-n.blue{color:var(--blue)}
.stat-l{font-size:11px;color:var(--muted);margin-top:2px}

/* Review */
.section-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:1.25rem 0 .5rem;padding-bottom:4px;border-bottom:1px solid #e5e7eb}
.rv-item{display:flex;gap:10px;padding:12px;border-radius:var(--rs);border:1px solid transparent;margin-bottom:6px;font-size:13px;line-height:1.5;align-items:flex-start;cursor:pointer;transition:all .2s}
.rv-item.ok{background:#f0fdf4;border-color:#bbf7d0}
.rv-item.ng{background:#fef2f2;border-color:#fecaca}
.rv-item:hover{opacity:.85}
.rv-icon{font-size:15px;margin-top:1px;flex-shrink:0}
.rv-body{flex:1}
.rv-wrong{font-size:12px;color:var(--red);margin-top:3px}
.detail-box{display:none;background:#fff;padding:12px;margin-top:10px;border-radius:var(--rs);border:1px solid var(--border);cursor:default;font-size:13px}
.detail-box.active{display:block;animation:fadeIn .2s}
.detail-q{line-height:1.7;margin-bottom:10px;color:var(--txt)}
.detail-c{padding:7px 11px;border-radius:5px;border:1px solid var(--border);margin-bottom:5px;background:#f9fafb;color:var(--muted)}
.detail-c.is-ans{border-color:#16a34a;background:#f0fdf4;color:#166534;font-weight:600}
.detail-c.is-wrong{border-color:#fca5a5;background:#fef2f2;color:#991b1b;text-decoration:line-through;opacity:.8}
.click-hint{font-size:11px;color:#9ca3af;font-weight:normal;margin-left:5px}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

/* Admin */
.adm-row-wrap{border-bottom:1px solid var(--border);padding:10px 0}
.adm-row-wrap:last-child{border-bottom:none}
.adm-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;cursor:pointer}
.adm-details{display:none;background:#f9fafb;padding:12px;border-radius:var(--rs);margin-top:8px;border:1px solid var(--border)}
.adm-details.active{display:block}
.adm-wrong-item{padding:10px 8px;border-bottom:1px dashed #e5e7eb;font-size:13px;line-height:1.5;cursor:pointer;border-radius:5px;transition:background .2s}
.adm-wrong-item:last-child{border-bottom:none}
.adm-wrong-item:hover{background:#f0f4f1}
.adm-rank{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
.rank-s{background:var(--gl);color:var(--gd)}.rank-a{background:var(--bl);color:#1d4ed8}
.rank-b{background:#fef3c7;color:#92400e}.rank-c{background:#fee2e2;color:#991b1b}
.adm-name{font-weight:600;transition:color .2s}.adm-row:hover .adm-name{color:var(--green)}
.adm-date{font-size:11px;color:var(--muted);margin-top:2px}
.adm-score{font-weight:700;color:var(--green);font-size:15px;margin-right:8px}
.empty{text-align:center;padding:2rem;color:var(--muted);font-size:14px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:999;padding:1rem}
.modal-box{background:#fff;border-radius:var(--r);padding:1.5rem;width:100%;max-width:340px;border:1px solid var(--border)}
.modal-box h3{font-size:16px;font-weight:700;margin-bottom:1rem}
.modal-btns{display:flex;gap:8px;margin-top:1rem}
.modal-btns button{flex:1;padding:10px;border-radius:var(--rs);font-size:14px;cursor:pointer;border:1px solid var(--border);background:#f9fafb;color:var(--txt)}
.modal-btns button.ok{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}
.err-msg{font-size:12px;color:var(--red);margin-top:4px;min-height:16px}

/* Spinner */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(26,115,80,.2);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}

/* SA tag */
.sa-tag{background:#f3e8ff;color:#7e22ce;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;display:inline-block;margin-right:4px}
</style>
</head>
<body>
<div class="wrap">

<!-- ── LANDING ── -->
<div id="s-landing" class="screen active">
  <div class="hdr">
    <div class="hdr-sub">문마중 Level 2 · Chapter 02</div>
    <div class="hdr-title">문장의 형식 리뷰 테스트</div>
  </div>
  <div class="card">
    <div class="info-grid">
      <div class="info-box"><div class="info-n">25</div><div class="info-l">총 문항</div></div>
      <div class="info-box"><div class="info-n">100</div><div class="info-l">총 배점</div></div>
      <div class="info-box"><div class="info-n">4점</div><div class="info-l">문항당 배점</div></div>
    </div>
    <div style="background:#f8fafb;border-radius:var(--rs);padding:.75rem 1rem;font-size:13px;color:var(--muted);margin-bottom:1.25rem;line-height:1.7">
      <strong style="color:var(--txt)">📋 시험 구성</strong><br>
      객관식 20문항 (1~20번) + 주관식 5문항 (21~25번)
    </div>
    <label for="name-in">이름</label>
    <input type="text" id="name-in" placeholder="예) 홍길동" autocomplete="off">
    <button class="btn btn-green" onclick="startQuiz()">테스트 시작 →</button>
    <button class="btn btn-outline" onclick="openAdminModal()">관리자 로그인</button>
  </div>
</div>

<!-- ── QUIZ ── -->
<div id="s-quiz" class="screen">
  <div class="hdr hdr-row">
    <div>
      <div class="hdr-sub" id="qz-name"></div>
      <div class="hdr-title" style="font-size:16px">Chapter 02 · 문장의 형식</div>
    </div>
    <span id="qz-cnt" style="font-size:13px;opacity:.8"></span>
  </div>
  <div class="card">
    <div class="prog-wrap">
      <div class="prog-info"><span id="prog-txt"></span><span id="prog-pct"></span></div>
      <div class="prog-bar"><div id="prog-fill" class="prog-fill" style="width:0%"></div></div>
    </div>
    <span id="q-badge" class="q-badge badge-a"></span>
    <div class="q-point" id="q-point"></div>
    <div class="q-text" id="q-text"></div>
    <div id="q-choices"></div>
    <div class="nav">
      <button class="nav-btn" id="btn-prev" onclick="nav(-1)">← 이전</button>
      <button class="nav-btn primary" id="btn-next" onclick="navNext()">다음 →</button>
    </div>
  </div>
</div>

<!-- ── RESULT ── -->
<div id="s-result" class="screen">
  <div class="hdr">
    <div class="hdr-sub">테스트 완료</div>
    <div class="hdr-title" id="res-name"></div>
  </div>
  <div class="card">
    <div class="score-wrap">
      <div class="score-ring"><span class="score-num" id="res-score"></span><span class="score-tot">/ 100</span></div>
      <div class="score-grade" id="res-grade"></div>
      <div class="score-msg" id="res-msg"></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-n" id="st-ok"></div><div class="stat-l">정답</div></div>
      <div class="stat"><div class="stat-n red" id="st-ng"></div><div class="stat-l">오답</div></div>
      <div class="stat"><div class="stat-n blue" id="st-mc"></div><div class="stat-l">객관식</div></div>
      <div class="stat"><div class="stat-n" id="st-sa"></div><div class="stat-l">주관식</div></div>
    </div>
    <div id="save-status" style="font-size:12px;color:var(--muted);text-align:center;margin:.5rem 0"></div>
    <div class="section-lbl">문항별 결과 (클릭하면 원지문·정답 확인)</div>
    <div id="review"></div>
    <button class="btn btn-outline" style="margin-top:1rem" onclick="goHome()">처음으로</button>
  </div>
</div>

<!-- ── ADMIN ── -->
<div id="s-admin" class="screen">
  <div class="hdr hdr-row">
    <div><div class="hdr-sub">관리자 패널</div><div class="hdr-title">학생 성적 현황</div></div>
    <button class="btn-sm" onclick="confirmClear()">전체 초기화</button>
  </div>
  <div class="card">
    <div class="stats" style="grid-template-columns:repeat(3,1fr)" id="adm-stats"></div>
    <div class="section-lbl">응시 학생 목록 (이름 클릭 → 오답 확인)</div>
    <div id="adm-list"></div>
    <button class="btn btn-outline" style="margin-top:1rem" onclick="goHome()">← 나가기</button>
  </div>
</div>

</div>

<!-- Admin Modal -->
<div id="modal" class="modal-bg" style="display:none">
  <div class="modal-box">
    <h3>관리자 비밀번호</h3>
    <input type="password" id="adm-pw" placeholder="비밀번호 입력"
      style="width:100%;padding:10px 14px;font-size:15px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--txt)">
    <div class="err-msg" id="pw-err"></div>
    <div class="modal-btns">
      <button onclick="closeModal()">취소</button>
      <button class="ok" onclick="checkPw()">로그인</button>
    </div>
  </div>
</div>

<script>
const FIREBASE_URL = "https://terrys-d643a-default-rtdb.firebaseio.com";
const DB_PATH = "/results_ch02_review.json";
const ADMIN_PW = "terry2025";
const TOTAL = 25;
const MC_COUNT = 20;

// ── 문제 데이터 ──────────────────────────────────────────

const Q = [
  /* 01 */ {
    type:"mc", n:1, t:"A", p:"Point 01 · 1형식 / 2형식",
    q:'다음 빈칸에 알맞은 말을 고르시오.<br><br>The leaves turn <span class="blank">_____</span> in autumn.',
    c:["① redly","② red","③ redden","④ to red","⑤ been red"],
    a:1, pts:4
  },
  /* 02 */ {
    type:"mc", n:2, t:"C", p:"Point 01 · 1형식 / 2형식",
    q:'다음 중 나머지와 <strong>문장의 형식이 다른</strong> 것을 고르시오.',
    c:["① Elizabeth lives in England.","② The plant will die without water.","③ My uncle works at this restaurant.","④ These bags are too heavy.","⑤ Many children play on the playground."],
    a:3, pts:4
  },
  /* 03 */ {
    type:"mc", n:3, t:"A", p:"Point 02 · 감각동사 + 형용사",
    q:'다음 빈칸에 알맞은 말을 고르시오.<br><br>This silk feels <span class="blank">_____</span>.',
    c:["① smoothly","② smooth","③ smoothing","④ to smooth","⑤ smoothed"],
    a:1, pts:4
  },
  /* 04 */ {
    type:"mc", n:4, t:"B", p:"Point 02 · 감각동사 + 형용사",
    q:'다음 중 <strong>어법상 옳은</strong> 것을 고르시오.',
    c:["① The flowers smell nicely.","② This coffee tastes bitterly.","③ My sister looks like mom.","④ It sounds strangely, but it\'s true.","⑤ I feel happily when I listen to this song."],
    a:2, pts:4
  },
  /* 05 */ {
    type:"mc", n:5, t:"C", p:"Point 03 · 3형식 / 4형식",
    q:'다음 중 <strong>4형식</strong> 문장을 고르시오.',
    c:["① Elizabeth lives in England.","② I clean my room every day.","③ Did you watch the videos?","④ Ivan showed her some photos.","⑤ He plays the guitar in the school band."],
    a:3, pts:4
  },
  /* 06 */ {
    type:"mc", n:6, t:"A", p:"Point 03 · 3형식 / 4형식",
    q:'다음 빈칸에 알맞은 말을 고르시오.<br><br>My parents gave <span class="blank">_____</span> a laptop.',
    c:["① I","② me","③ my","④ mine","⑤ myself"],
    a:1, pts:4
  },
  /* 07 */ {
    type:"mc", n:7, t:"A", p:"Point 04 · 4형식→3형식 전환",
    q:'다음 4형식 문장을 3형식 문장으로 전환할 때, 빈칸에 알맞은 전치사를 고르시오.<br><br>He bought some flowers <span class="blank">_____</span> his mother.',
    c:["① to","② of","③ for","④ from","⑤ by"],
    a:2, pts:4
  },
  /* 08 */ {
    type:"mc", n:8, t:"C", p:"Point 04 · 4형식→3형식 전환",
    q:'다음 중 <strong>문장의 전환이 바르지 않은</strong> 것을 고르시오.',
    c:[
      "① I couldn\'t write a letter to him. → I couldn\'t write him a letter.",
      "② Can you teach Spanish to me? → Can you teach me Spanish?",
      "③ Steve asked me a favor. → Steve asked a favor of me.",
      "④ She brought some board games to us. → She brought some board games us.",
      "⑤ Will you buy me another pair of shoes? → Will you buy another pair of shoes for me?"
    ],
    a:3, pts:4
  },
  /* 09 */ {
    type:"mc", n:9, t:"A", p:"Point 05 · 5형식 (목적격 보어: 명사/형용사)",
    q:'다음 빈칸에 알맞은 말을 고르시오.<br><br>The challenge made the boy <span class="blank">_____</span>.',
    c:["① a hero","② heroically","③ to a hero","④ being hero","⑤ to heroic"],
    a:0, pts:4
  },
  /* 10 */ {
    type:"mc", n:10, t:"B", p:"Point 05 · 5형식 (목적격 보어: 명사/형용사)",
    q:'다음 중 <strong>어법상 옳은</strong> 것을 고르시오.',
    c:[
      "① Nicole found the book usefully.",
      "② Please leave alone me.",
      "③ Everyone calls a genius me.",
      "④ My interview with the man made me nervous.",
      "⑤ We named Oreo our pet rabbit."
    ],
    a:3, pts:4
  },
  /* 11 */ {
    type:"mc", n:11, t:"A", p:"Point 06 · 5형식 (목적격 보어: to부정사)",
    q:'다음 빈칸에 알맞은 말을 고르시오.<br><br>I expect him <span class="blank">_____</span> soon.',
    c:["① arrive","② arriving","③ to arrive","④ arrived","⑤ arrives"],
    a:2, pts:4
  },
  /* 12 */ {
    type:"mc", n:12, t:"C", p:"Point 06 · 5형식 (목적격 보어: to부정사)",
    q:'다음 중 <strong>어법상 틀린</strong> 것을 고르시오.',
    c:[
      "① I want you to listen carefully.",
      "② My teacher allowed me to leave early.",
      "③ She often asks them to work on weekends.",
      "④ His parents want him be a scientist.",
      "⑤ The police officer ordered him to stop the car."
    ],
    a:3, pts:4
  },
  /* 13 */ {

const GRADES=[
  {min:90,g:"S",label:"S — 최우수",msg:"완벽에 가까운 실력입니다! 🎉"},
  {min:80,g:"A",label:"A — 우수",msg:"핵심 문법을 잘 이해했습니다!"},

  {min:0, g:"D",label:"D — 부족",msg:"Point별로 처음부터 다시 학습하세요."}
];

// ── 상태 변수 ───────────────────────────────────────────
let studentName='', mcAns=new Array(MC_COUNT).fill(-1), saAns=new Array(5).fill(''), cur=0;

// ── 화면 전환 ───────────────────────────────────────────
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('s-'+id).classList.add('active');}
function goHome(){document.getElementById('name-in').value='';show('landing');}

// ── 퀴즈 시작 ───────────────────────────────────────────
function startQuiz(){
  studentName=document.getElementById('name-in').value.trim();
  if(!studentName){alert('이름을 입력해주세요.');return;}
  mcAns=new Array(MC_COUNT).fill(-1);
  saAns=new Array(5).fill('');
  cur=0;
  document.getElementById('qz-name').textContent=studentName;
  render(0);show('quiz');
}

// ── 렌더링 ──────────────────────────────────────────────
function render(i){
  const q=Q[i];
  const pct=Math.round(i/TOTAL*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  const pf=document.getElementById('prog-fill');
  pf.className='prog-fill'+(q.type==='sa'?' sa-fill':'');
  document.getElementById('prog-txt').textContent=(i+1)+' / '+TOTAL;
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('qz-cnt').textContent=(i+1)+'/'+TOTAL;

  const badge=document.getElementById('q-badge');
  if(q.type==='sa'){
    badge.textContent='[서술형]';badge.className='q-badge badge-sa';
  } else {
    const map={A:'[A형] 빈칸 채우기',B:'[B형] 어법상 옳은 것',C:'[C형] 어법상 틀린 것 / 형식 구별'};
    badge.textContent=map[q.t]||'';
    badge.className='q-badge badge-'+q.t.toLowerCase();
  }
  document.getElementById('q-point').innerHTML=q.p+'<span class="q-pts">'+q.pts+'점</span>';
  document.getElementById('q-text').innerHTML=q.q;

  const el=document.getElementById('q-choices');
  el.innerHTML='';
  if(q.type==='mc'){
    const div=document.createElement('div');div.className='choices';
    q.c.forEach((c,ci)=>{
      const b=document.createElement('button');
      b.className='choice'+(mcAns[i]===ci?' sel':'');
      b.innerHTML=c;
      b.onclick=()=>pickMC(i,ci);
      div.appendChild(b);
    });
    el.appendChild(div);
  } else {
    // SA
    const si=i-MC_COUNT;
    const wrap=document.createElement('div');wrap.className='sa-input-wrap';
    const lbl=document.createElement('div');lbl.className='sa-input-label';lbl.textContent='답을 쓰세요:';
    const inp=document.createElement('input');
    inp.type='text';inp.className='sa-input';
    inp.placeholder='영어로 답을 입력하세요';
    inp.value=saAns[si]||'';
    inp.oninput=e=>{saAns[si]=e.target.value;};
    wrap.appendChild(lbl);wrap.appendChild(inp);
    el.appendChild(wrap);
    setTimeout(()=>{inp.focus();},50);
  }

  document.getElementById('btn-prev').disabled=i===0;
  document.getElementById('btn-next').textContent=i===TOTAL-1?'제출 →':'다음 →';
}

function pickMC(qi,ci){
  mcAns[qi]=ci;
  document.getElementById('q-choices').querySelectorAll('.choice').forEach((b,i)=>{
    b.classList.toggle('sel',i===ci);
  });
}

function nav(d){cur=Math.max(0,Math.min(TOTAL-1,cur+d));render(cur);}

function navNext(){
  if(cur===TOTAL-1){
    const emptyMC=mcAns.filter(a=>a===-1).length;
    const emptySA=saAns.filter(a=>!a.trim()).length;
    const total=emptyMC+emptySA;
    if(total>0&&!confirm(`${total}문항을 아직 풀지 않았습니다. 제출하시겠습니까?`))return;
    submit();
  } else {nav(1);}
}

// ── 정답 확인 (SA) ──────────────────────────────────────
function checkSA(studentAns, q){
  const norm=s=>s.toLowerCase().trim().replace(/\.+$/,'');
  const sn=norm(studentAns);
  return q.accepts.some(a=>norm(a)===sn);
}

// ── 제출 ──────────────────────────────────────────────
async function submit(){
  let mcScore=0, saScore=0;
  mcAns.forEach((a,i)=>{if(a===Q[i].a)mcScore+=Q[i].pts;});
  saAns.forEach((a,i)=>{if(checkSA(a,Q[MC_COUNT+i]))saScore+=Q[MC_COUNT+i].pts;});
  const totalScore=mcScore+saScore;
  const pct=totalScore; // /100*100 = just totalScore
  const grade=GRADES.find(g=>totalScore>=g.min);

  document.getElementById('res-name').textContent=studentName+'님의 결과';
  document.getElementById('res-score').textContent=totalScore;
  document.getElementById('res-grade').textContent=grade.label;
  document.getElementById('res-msg').textContent=grade.msg;
  document.getElementById('st-ok').textContent=mcAns.filter((a,i)=>a===Q[i].a).length+saAns.filter((a,i)=>checkSA(a,Q[MC_COUNT+i])).length;
  document.getElementById('st-ng').textContent=TOTAL-parseInt(document.getElementById('st-ok').textContent);
  document.getElementById('st-mc').textContent=mcScore+'점';
  document.getElementById('st-sa').textContent=saScore+'점';

  // 리뷰 렌더링
  const rv=document.getElementById('review');rv.innerHTML='';
  Q.forEach((q,i)=>{
    let ok;
    if(q.type==='mc') ok=mcAns[i]===q.a;
    else ok=checkSA(saAns[i-MC_COUNT],q);

    let choicesHtml='';
    if(q.type==='mc'){
      const stuAns=mcAns[i];
      choicesHtml=q.c.map((c,ci)=>{
        let cls='detail-c';
        if(ci===q.a)cls+=' is-ans';
        else if(ci===stuAns)cls+=' is-wrong';
        return `<div class="${cls}">${c}</div>`;
      }).join('');
    } else {
      const si=i-MC_COUNT;
      choicesHtml=`<div style="font-size:13px;margin-top:6px;">
        <div style="padding:7px 11px;border-radius:5px;border:1px solid ${ok?'#16a34a':'#fca5a5'};background:${ok?'#f0fdf4':'#fef2f2'};color:${ok?'#166534':'#991b1b'};margin-bottom:5px">
          내 답: ${saAns[si]||'(미응답)'}
        </div>
        <div class="detail-c is-ans">정답: ${q.a}</div>
      </div>`;
    }

    const d=document.createElement('div');
    d.className='rv-item '+(ok?'ok':'ng');
    d.setAttribute('onclick',`document.getElementById('rv-det-${i}').classList.toggle('active')`);
    d.innerHTML=`
      <span class="rv-icon">${ok?'✓':'✗'}</span>
      <div class="rv-body">
        <div style="font-size:14px;margin-bottom:3px">
          ${q.type==='sa'?`<span class="sa-tag">서술형</span>`:''}
          <strong>${i+1}번</strong> ${q.p} · ${q.pts}점
          <span class="click-hint">(클릭 ▾)</span>
        </div>
        ${!ok&&q.type==='mc'?`<div class="rv-wrong">내 답: ${mcAns[i]>=0?q.c[mcAns[i]].split(' ')[0]:'미응답'} → 정답: ${q.c[q.a].split(' ')[0]}</div>`:''}
        ${!ok&&q.type==='sa'?`<div class="rv-wrong">내 답: ${saAns[i-MC_COUNT]||'미응답'} → 정답: ${q.a}</div>`:''}
        <div class="detail-box" id="rv-det-${i}" onclick="event.stopPropagation()">
          <div class="detail-q">${q.q}</div>
          ${choicesHtml}
        </div>
      </div>`;
    rv.appendChild(d);
  });

  show('result');

  // Firebase 저장
  const statusEl=document.getElementById('save-status');
  statusEl.innerHTML='<span class="spinner"></span>점수 저장 중...';
  try{
    const payload={
      name:studentName, score:totalScore, total:100, pct:totalScore,
      grade:grade.g, mcScore, saScore,
      mcAnswers:mcAns, saAnswers:saAns,
      date:new Date().toLocaleString('ko-KR'), ts:Date.now()
    };
    const r=await fetch(FIREBASE_URL+DB_PATH,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    statusEl.innerHTML=r.ok?'<span style="color:var(--green)">✓ 점수가 저장되었습니다</span>':'저장 실패 ('+r.status+')';
  }catch(e){statusEl.textContent='저장 실패: '+e.message;}
}

// ── 관리자 ──────────────────────────────────────────────
function openAdminModal(){document.getElementById('adm-pw').value='';document.getElementById('pw-err').textContent='';document.getElementById('modal').style.display='flex';setTimeout(()=>document.getElementById('adm-pw').focus(),100);}
function closeModal(){document.getElementById('modal').style.display='none';}
document.getElementById('adm-pw').addEventListener('keydown',e=>{if(e.key==='Enter')checkPw();});

async function loadAdmin(){
  show('admin');
  const listEl=document.getElementById('adm-list');
  const statsEl=document.getElementById('adm-stats');
  listEl.innerHTML='<div class="empty"><span class="spinner"></span>불러오는 중...</div>';

    const r=await fetch(FIREBASE_URL+DB_PATH);

    if(!data){listEl.innerHTML='<div class="empty">아직 응시한 학생이 없습니다.</div>';statsEl.innerHTML='';return;}
    const results=Object.values(data).filter(r=>r&&r.name&&r.score!==undefined).sort((a,b)=>b.score-a.score);
    if(!results.length){listEl.innerHTML='<div class="empty">유효한 응시 기록이 없습니다.</div>';statsEl.innerHTML='';return;}
    const avg=(results.reduce((s,r)=>s+(Number(r.score)||0),0)/results.length).toFixed(1);
    statsEl.innerHTML=`
      <div class="stat"><div class="stat-n">${results.length}</div><div class="stat-l">응시 인원</div></div>
      <div class="stat"><div class="stat-n">${avg}</div><div class="stat-l">평균 점수</div></div>
      <div class="stat"><div class="stat-n">${results[0].score||0}</div><div class="stat-l">최고 점수</div></div>`;
    listEl.innerHTML='';
    results.forEach((r,i)=>{
      const gc=r.score>=90?'s':r.score>=80?'a':r.score>=60?'b':'c';
      const gl=r.score>=90?'S':r.score>=80?'A':r.score>=60?'B':'C';

      let wrongHtml='';
      if(r.mcAnswers&&Array.isArray(r.mcAnswers)){
        let wrongs=[];
        r.mcAnswers.forEach((ansIdx,idx)=>{
          if(!Q[idx])return;
          if(ansIdx!==Q[idx].a){
            const stuAns=ansIdx;
            let chHtml=Q[idx].c.map((c,ci)=>{
              let cls='detail-c';
              if(ci===Q[idx].a)cls+=' is-ans';
              else if(ci===stuAns)cls+=' is-wrong';
              return `<div class="${cls}">${c}</div>`;
            }).join('');
            wrongs.push(`
              <div class="adm-wrong-item" onclick="document.getElementById('adm-det-${i}-${idx}').classList.toggle('active');event.stopPropagation()">
                <div style="display:flex;gap:8px;align-items:flex-start">
                  <span style="font-weight:700;color:var(--txt);flex-shrink:0;min-width:32px">${idx+1}번</span>
                  <div style="flex:1">
                    <div style="margin-bottom:3px"><span style="font-weight:600">${Q[idx].p}</span> <span class="click-hint">(클릭 ▾)</span></div>
                    학생: <span style="color:var(--red);font-weight:600">${ansIdx>=0?Q[idx].c[ansIdx].split(' ')[0]:'미응답'}</span> → 정답: <span style="color:var(--green);font-weight:600">${Q[idx].c[Q[idx].a].split(' ')[0]}</span>
                    <div class="detail-box" id="adm-det-${i}-${idx}" onclick="event.stopPropagation()">
                      <div class="detail-q">${Q[idx].q}</div>
                      ${chHtml}
                    </div>
                  </div>
                </div>
              </div>`);
          }
        });
        // SA 오답
        if(r.saAnswers&&Array.isArray(r.saAnswers)){
          r.saAnswers.forEach((sa,si)=>{
            const qi=MC_COUNT+si;
            if(!Q[qi])return;
            if(!checkSA(sa,Q[qi])){
              wrongs.push(`
                <div class="adm-wrong-item">
                  <div style="display:flex;gap:8px;align-items:flex-start">
                    <span class="sa-tag">서술형</span>
                    <span style="font-weight:700;color:var(--txt);flex-shrink:0;min-width:28px">${qi+1}번</span>
                    <div style="flex:1">
                      <div style="margin-bottom:3px;font-weight:600">${Q[qi].p}</div>
                      학생: <span style="color:var(--red);font-weight:600">${sa||'미응답'}</span><br>정답: <span style="color:var(--green);font-weight:600">${Q[qi].a}</span>
                    </div>
                  </div>
                </div>`);
            }
          });
        }
        wrongHtml=`<div class="adm-details" id="detail-${i}">
          <div style="font-size:12px;font-weight:700;margin-bottom:10px;color:var(--txt)">[틀린 문항 확인]</div>
          ${wrongs.length>0?wrongs.join(''):'<div style="color:var(--green);font-weight:600;text-align:center">모든 문제 정답! 🎉</div>'}
        </div>`;
      } else {
        wrongHtml=`<div class="adm-details" id="detail-${i}"><div style="color:var(--muted);text-align:center;font-size:12px">상세 데이터 없음</div></div>`;
      }

      const rowWrap=document.createElement('div');rowWrap.className='adm-row-wrap';
      rowWrap.innerHTML=`
        <div class="adm-row" onclick="document.getElementById('detail-${i}').classList.toggle('active')">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:12px;color:var(--muted);min-width:20px">${i+1}</span>
            <div><div class="adm-name">${r.name} <span style="font-size:11px;color:#9ca3af;font-weight:normal">(클릭)</span></div><div class="adm-date">${r.date||''}</div></div>
          </div>
          <div style="display:flex;align-items:center">
            <span class="adm-score">${r.score}점</span>
            <span class="adm-rank rank-${gc}">${gl}</span>
            <span style="color:#d1d5db;margin-left:8px;font-size:18px">▾</span>
          </div>
        </div>
        ${wrongHtml}`;
      listEl.appendChild(rowWrap);
    });
  }catch(e){listEl.innerHTML='<div class="empty">데이터 불러오기 실패: '+e.message+'</div>';}
}

async function confirmClear(){
  if(!confirm('모든 응시 기록을 삭제하시겠습니까?'))return;
  try{await fetch(FIREBASE_URL+DB_PATH,{method:'DELETE'});loadAdmin();}catch(e){alert('삭제 실패: '+e.message);}
}
</script>
