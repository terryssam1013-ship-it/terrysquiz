<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>어법끝 START — UNIT 01 리뷰 테스트</title>
<style>
/* ── 설정 방법 ──────────────────────────────────────────────
   1. https://console.firebase.google.com 접속
   2. "프로젝트 추가" → 이름 입력 → Google Analytics 끄기 → 만들기
   3. 왼쪽 메뉴 "빌드 > Realtime Database" → "데이터베이스 만들기"
   4. 위치: 미국(기본값) → "테스트 모드에서 시작" 선택 → 사용 설정
   5. 상단에 표시되는 URL (https://your-project.firebaseio.com) 복사
   6. 아래 FIREBASE_URL 값을 해당 URL로 교체 후 Netlify에 다시 업로드
   ──────────────────────────────────────────────────────── */
:root {
  --green: #1a7350;
  --green-light: #e1f5ee;
  --green-dark: #0f6e56;
  --red: #a32d2d;
  --red-light: #faece7;
  --blue-light: #e6f1fb;
  --bg: #f4f6f4;
  --card: #ffffff;
  --text: #1a1a1a;
  --text-muted: #6b7280;
  --border: rgba(0,0,0,.1);
  --radius: 12px;
  --radius-sm: 8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1rem}
.wrap{max-width:680px;margin:0 auto}
.screen{display:none}
.screen.active{display:block}

/* Header */
.hdr{background:var(--green);color:#fff;border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:1rem}
.hdr-sub{font-size:13px;opacity:.75;margin-bottom:4px}
.hdr-title{font-size:21px;font-weight:600}
.hdr-row{display:flex;align-items:center;justify-content:space-between}

/* Card */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:.75rem}

/* Inputs */
label{font-size:14px;font-weight:500;display:block;margin-bottom:6px}
input[type=text],input[type=password]{width:100%;padding:11px 14px;font-size:15px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--text);margin-bottom:14px}
input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(26,115,80,.12)}

/* Buttons */
.btn{display:block;width:100%;padding:12px;font-size:15px;font-weight:500;border-radius:var(--radius-sm);border:none;cursor:pointer;transition:all .15s;text-align:center}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:var(--green-dark)}
.btn-outline{background:#fff;color:var(--text-muted);border:1px solid var(--border);margin-top:8px}
.btn-outline:hover{background:#f9f9f9}
.btn-sm{padding:7px 14px;font-size:13px;width:auto;display:inline-block;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;cursor:pointer}

/* Progress */
.prog-wrap{margin-bottom:1.25rem}
.prog-bar{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin:5px 0 3px}
.prog-fill{height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.prog-info{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted)}

/* Question */
.q-badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;margin-bottom:10px;letter-spacing:.03em}
.badge-a{background:#e1f5ee;color:#0f6e56}
.badge-b{background:#dbeafe;color:#1d4ed8}
.badge-c{background:#fef3c7;color:#92400e}
.q-point{font-size:11px;color:var(--text-muted);margin-bottom:8px}
.q-text{font-size:15px;line-height:1.75;margin-bottom:1.25rem}
.blank{display:inline-block;border-bottom:2.5px solid var(--green);min-width:72px;text-align:center;color:var(--green);font-weight:600;padding:0 4px}
.uline{text-decoration:underline;text-decoration-color:#dc2626;text-underline-offset:3px;font-weight:600;color:#991b1b}

/* Choices */
.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:1.25rem}
.choice{text-align:left;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--text);cursor:pointer;font-size:14px;line-height:1.6;transition:all .15s}
.choice:hover{border-color:var(--green);background:var(--green-light)}
.choice.sel{border-color:var(--green);background:var(--green-light);color:var(--green-dark);font-weight:500}
.choice.correct{border-color:#16a34a;background:#f0fdf4;color:#166534}
.choice.wrong{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.choice.show-correct{border-color:#16a34a;background:#f0fdf4;color:#166534}

/* Nav */
.nav{display:flex;gap:8px}
.nav-btn{flex:1;padding:11px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:#f9fafb;color:var(--text-muted);transition:all .15s}
.nav-btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.nav-btn:hover:not(:disabled){opacity:.85}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}

/* Score */
.score-wrap{text-align:center;padding:1.5rem 0 1rem}
.score-ring{width:130px;height:130px;border-radius:50%;background:var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 1rem;color:#fff}
.score-num{font-size:40px;font-weight:700;line-height:1}
.score-total{font-size:14px;opacity:.75;margin-top:2px}
.score-grade{font-size:22px;font-weight:600;color:var(--green);margin-bottom:4px}
.score-msg{font-size:13px;color:var(--text-muted)}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:.75rem 0}
.stat{background:#f9fafb;border-radius:var(--radius-sm);padding:.75rem;text-align:center;border:1px solid var(--border)}
.stat-n{font-size:24px;font-weight:600;color:var(--green)}
.stat-n.red{color:var(--red)}
.stat-l{font-size:11px;color:var(--text-muted);margin-top:2px}

/* Review */
.review-item{display:flex;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid transparent;margin-bottom:6px;font-size:13px;line-height:1.5;align-items:flex-start}
.review-item.ok{background:#f0fdf4;border-color:#bbf7d0}
.review-item.ng{background:#fef2f2;border-color:#fecaca}
.review-icon{font-size:15px;margin-top:1px;flex-shrink:0}
.review-body{flex:1}
.review-wrong{font-size:12px;color:var(--red);margin-top:3px}

/* Admin */
.admin-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);font-size:14px}
.admin-row:last-child{border-bottom:none}
.admin-rank{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.rank-s{background:#e1f5ee;color:#0f6e56}
.rank-a{background:#dbeafe;color:#1d4ed8}
.rank-b{background:#fef3c7;color:#92400e}
.rank-c{background:#fee2e2;color:#991b1b}
.admin-name{font-weight:500}
.admin-date{font-size:11px;color:var(--text-muted);margin-top:1px}
.admin-score{font-weight:600;color:var(--green);font-size:15px;margin-right:8px}
.section-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:1.25rem 0 .5rem;padding-bottom:4px;border-bottom:1px solid var(--border)}
.empty{text-align:center;padding:2rem;color:var(--text-muted);font-size:14px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:999;padding:1rem}
.modal-box{background:#fff;border-radius:var(--radius);padding:1.5rem;width:100%;max-width:340px;border:1px solid var(--border)}
.modal-box h3{font-size:16px;font-weight:600;margin-bottom:1rem}
.modal-btns{display:flex;gap:8px;margin-top:1rem}
.modal-btns button{flex:1;padding:10px;border-radius:var(--radius-sm);font-size:14px;cursor:pointer;border:1px solid var(--border);background:#f9fafb;color:var(--text)}
.modal-btns button.ok{background:var(--green);color:#fff;border-color:var(--green);font-weight:500}
.err-msg{font-size:12px;color:var(--red);margin-top:4px;min-height:16px}

/* Loading spinner */
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(26,115,80,.2);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Config banner */
.config-banner{background:#fef3c7;border:1px solid #fcd34d;border-radius:var(--radius-sm);padding:1rem 1.25rem;margin-bottom:1rem;font-size:13px;color:#78350f;line-height:1.6}
.config-banner strong{display:block;font-size:14px;margin-bottom:4px}
.config-banner code{background:#fde68a;padding:1px 5px;border-radius:4px;font-family:monospace;font-size:12px}
</style>
</head>
<body>
<div class="wrap">

<!-- ── LANDING ───────────────────────────────────────────── -->
<div id="s-landing" class="screen active">
  <div class="hdr">
    <div class="hdr-sub">어법끝 START — UNIT 01</div>
    <div class="hdr-title">주어와 동사의 수일치 리뷰 테스트</div>
  </div>
  <div id="config-warn" class="config-banner" style="display:none">
    <strong>⚠️ Firebase 미설정 — 점수가 저장되지 않습니다</strong>
    파일 상단 주석의 설정 방법을 따라 <code>FIREBASE_URL</code> 값을 교체해주세요.
  </div>
  <div class="card">
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:1rem">25문항 · 5지선다 · 수능 어법 유형</p>
    <label for="name-in">이름</label>
    <input type="text" id="name-in" placeholder="예) 홍길동" autocomplete="off">
    <button class="btn btn-green" onclick="startQuiz()">테스트 시작 →</button>
    <button class="btn btn-outline" onclick="openAdminModal()">관리자 로그인</button>
  </div>
</div>

<!-- ── QUIZ ──────────────────────────────────────────────── -->
<div id="s-quiz" class="screen">
  <div class="hdr hdr-row">
    <div>
      <div class="hdr-sub" id="qz-name"></div>
      <div class="hdr-title" style="font-size:16px">UNIT 01 수일치 테스트</div>
    </div>
    <span id="qz-counter" style="font-size:13px;opacity:.8"></span>
  </div>
  <div class="card">
    <div class="prog-wrap">
      <div class="prog-info"><span id="prog-txt"></span><span id="prog-pct"></span></div>
      <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
    <span id="q-badge" class="q-badge badge-a"></span>
    <div class="q-point" id="q-point"></div>
    <div class="q-text" id="q-text"></div>
    <div class="choices" id="q-choices"></div>
    <div class="nav">
      <button class="nav-btn" id="btn-prev" onclick="nav(-1)">← 이전</button>
      <button class="nav-btn primary" id="btn-next" onclick="navNext()">다음 →</button>
    </div>
  </div>
</div>

<!-- ── RESULT ────────────────────────────────────────────── -->
<div id="s-result" class="screen">
  <div class="hdr">
    <div class="hdr-sub">테스트 완료</div>
    <div class="hdr-title" id="res-name"></div>
  </div>
  <div class="card">
    <div class="score-wrap">
      <div class="score-ring"><span class="score-num" id="res-score"></span><span class="score-total" id="res-total"></span></div>
      <div class="score-grade" id="res-grade"></div>
      <div class="score-msg" id="res-msg"></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-n" id="st-ok"></div><div class="stat-l">정답</div></div>
      <div class="stat"><div class="stat-n red" id="st-ng"></div><div class="stat-l">오답</div></div>
      <div class="stat"><div class="stat-n" id="st-pct"></div><div class="stat-l">정답률</div></div>
    </div>
    <div id="save-status" style="font-size:12px;color:var(--text-muted);text-align:center;margin:.5rem 0"></div>
    <div class="section-lbl">문항별 결과</div>
    <div id="review"></div>
    <button class="btn btn-outline" style="margin-top:1rem" onclick="goHome()">처음으로</button>
  </div>
</div>

<!-- ── ADMIN ─────────────────────────────────────────────── -->
<div id="s-admin" class="screen">
  <div class="hdr hdr-row">
    <div><div class="hdr-sub">관리자 패널</div><div class="hdr-title">학생 성적 현황</div></div>
    <button class="btn-sm" onclick="confirmClear()">전체 초기화</button>
  </div>
  <div class="card">
    <div class="stats" id="adm-stats"></div>
    <div class="section-lbl">응시 학생 목록</div>
    <div id="adm-list"></div>
    <button class="btn btn-outline" style="margin-top:1rem" onclick="goHome()">← 나가기</button>
  </div>
</div>

</div><!-- /wrap -->

<!-- Admin Modal -->
<div id="modal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <h3>관리자 비밀번호</h3>
    <input type="password" id="adm-pw" placeholder="비밀번호 입력"
      style="width:100%;padding:10px 14px;font-size:15px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text)">
    <div class="err-msg" id="pw-err"></div>
    <div class="modal-btns">
      <button onclick="closeModal()">취소</button>
      <button class="ok" onclick="checkPw()">로그인</button>
    </div>
  </div>
</div>

      '④ The athletes who train at this facility <span class="uline">have</span> won several national championships.',
      '⑤ Behind the old wooden door <span class="uline">was</span> a secret passage leading to the garden.'],a:2},
  {t:"C",p:"어법상 틀린 것",
   q:'다음 ①~⑤의 밑줄 친 부분 중, <strong>어법상 틀린</strong> 것을 고르시오.',
   c:['① Whether learning a foreign language is difficult or easy <span class="uline">depends</span> on the individual learner.',
      '② One of the most fascinating aspects of the entire trip <span class="uline">was</span> the local cuisine.',
      '③ The policies introduced by the new administration <span class="uline">has</span> faced strong public opposition.',
      '④ Nowhere in the world <span class="uline">is</span> there a natural landscape quite like that of Iceland.',
      '⑤ The majority of the participants in the online survey <span class="uline">were</span> satisfied with the results.'],a:2},
];

const GRADES=[{min:23,g:"S",label:"S — 매우 우수",msg:"거의 완벽한 이해도입니다! 🎉"},
              {min:20,g:"A",label:"A — 우수",msg:"핵심 개념을 잘 이해했습니다."},
              {min:15,g:"B",label:"B — 양호",msg:"조금 더 복습이 필요해요."},
              {min:10,g:"C",label:"C — 보통",msg:"교재를 다시 꼼꼼히 읽어보세요."},
              {min:0,g:"D",label:"D — 부족",msg:"Point별로 처음부터 다시 학습하세요."}];

let studentName='', ans=new Array(TOTAL).fill(-1), cur=0;

// ── Navigation helpers ───────────────────────────────
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('s-'+id).classList.add('active')}
function goHome(){document.getElementById('name-in').value='';show('landing')}

// ── Quiz ────────────────────────────────────────────
function startQuiz(){
  studentName=document.getElementById('name-in').value.trim();
  if(!studentName){alert('이름을 입력해주세요.');return;}
  ans=new Array(TOTAL).fill(-1);cur=0;
  document.getElementById('qz-name').textContent=studentName;
  render(0);show('quiz');
}

function render(i){
  const q=Q[i];
  const pct=Math.round(i/TOTAL*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-txt').textContent=(i+1)+' / '+TOTAL;
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('qz-counter').textContent=(i+1)+'/'+TOTAL;
  const badge=document.getElementById('q-badge');
  badge.textContent=q.t==='A'?'[A형] 빈칸 채우기':q.t==='B'?'[B형] 어법상 옳은 것':'[C형] 어법상 틀린 것';
  badge.className='q-badge badge-'+q.t.toLowerCase();
  document.getElementById('q-point').textContent=q.p;
  document.getElementById('q-text').innerHTML=q.q;
  const el=document.getElementById('q-choices');
  el.innerHTML='';
  q.c.forEach((c,ci)=>{
    const b=document.createElement('button');
    b.className='choice';b.innerHTML=c;
    if(ans[i]===ci)b.classList.add('sel');
    b.onclick=()=>pick(i,ci);
    el.appendChild(b);
  });
  document.getElementById('btn-prev').disabled=i===0;
  const nb=document.getElementById('btn-next');
  nb.textContent=i===TOTAL-1?'제출 →':'다음 →';
}

function pick(qi,ci){
  ans[qi]=ci;
  document.getElementById('q-choices').querySelectorAll('.choice').forEach((b,i)=>{
    b.classList.toggle('sel',i===ci);
  });
}

function nav(d){cur=Math.max(0,Math.min(TOTAL-1,cur+d));render(cur)}

function navNext(){
  if(cur===TOTAL-1){
    const empty=ans.filter(a=>a===-1).length;
    if(empty>0&&!confirm(`${empty}문항을 아직 풀지 않았습니다. 제출하시겠습니까?`))return;
    submit();
  }else{nav(1);}
}

// ── Submit & Result ──────────────────────────────────
async function submit(){
  const score=ans.filter((a,i)=>a===Q[i].a).length;
  const pct=Math.round(score/TOTAL*100);
  const grade=GRADES.find(g=>score>=g.min);

  document.getElementById('res-name').textContent=studentName+'님의 결과';
  document.getElementById('res-score').textContent=score;
  document.getElementById('res-total').textContent='/ '+TOTAL;
  document.getElementById('res-grade').textContent=grade.label;
  document.getElementById('res-msg').textContent=grade.msg;
  document.getElementById('st-ok').textContent=score;
  document.getElementById('st-ng').textContent=TOTAL-score;
  document.getElementById('st-pct').textContent=pct+'%';

  const rv=document.getElementById('review');rv.innerHTML='';
  Q.forEach((q,i)=>{
    const ok=ans[i]===q.a;
    const d=document.createElement('div');
    d.className='review-item '+(ok?'ok':'ng');
    d.innerHTML=`<span class="review-icon">${ok?'✓':'✗'}</span>
      <div class="review-body">
        <strong>${i+1}번</strong> ${q.p}
        ${!ok?`<div class="review-wrong">내 답: ${ans[i]>=0?q.c[ans[i]].split(' ')[0]:'미응답'} → 정답: ${q.c[q.a].split(' ')[0]}</div>`:''}
      </div>`;
    rv.appendChild(d);
  });

  show('result');

  // Firebase 저장
  const statusEl=document.getElementById('save-status');
  if(!FIREBASE_URL.startsWith("http")){
    statusEl.textContent='⚠️ Firebase 미설정 — 점수가 저장되지 않았습니다';
    return;
  }
  statusEl.innerHTML='<span class="spinner"></span>점수 저장 중...';
  try{
    const payload={name:studentName,score:score,total:TOTAL,pct,grade:grade.g,answers:ans,date:new Date().toLocaleString('ko-KR'),ts:Date.now()};
    const r=await fetch(FIREBASE_URL+'/results.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(r.ok){statusEl.innerHTML='<span style="color:var(--green)">✓ 점수가 저장되었습니다</span>';}
    else{statusEl.textContent='저장 실패 ('+r.status+')';}
  }catch(e){statusEl.textContent='저장 실패: '+e.message;}
}

// ── Admin ────────────────────────────────────────────
function openAdminModal(){
  document.getElementById('adm-pw').value='';
  document.getElementById('pw-err').textContent='';
  document.getElementById('modal').style.display='flex';
  setTimeout(()=>document.getElementById('adm-pw').focus(),100);
}
function closeModal(){document.getElementById('modal').style.display='none';}
document.getElementById('adm-pw').addEventListener('keydown',e=>{if(e.key==='Enter')checkPw();});

function checkPw(){
  if(document.getElementById('adm-pw').value===ADMIN_PW){closeModal();loadAdmin();}
  else document.getElementById('pw-err').textContent='비밀번호가 올바르지 않습니다.';
}

async function loadAdmin(){
  show('admin');
  const listEl=document.getElementById('adm-list');
  const statsEl=document.getElementById('adm-stats');
  listEl.innerHTML='<div class="empty"><span class="spinner"></span>불러오는 중...</div>';

  if(!FIREBASE_URL.startsWith("http")){
    listEl.innerHTML='<div class="empty">⚠️ Firebase가 설정되지 않았습니다</div>';
    statsEl.innerHTML='';return;
  }

  try{
    const r=await fetch(FIREBASE_URL+'/results.json');
    const data=await r.json();
    if(!data){listEl.innerHTML='<div class="empty">아직 응시한 학생이 없습니다.</div>';statsEl.innerHTML='';return;}

    const raw=Object.values(data);
    const results=raw.filter(r=>r&&r.name&&r.score!==undefined).sort((a,b)=>b.score-a.score);
    if(results.length===0){listEl.innerHTML='<div class="empty">유효한 응시 기록이 없습니다.<br><small style="color:#999">Firebase DB에서 results 노드를 확인해주세요.</small></div>';statsEl.innerHTML='';return;}
    const avg=(results.reduce((s,r)=>s+(Number(r.score)||0),0)/results.length).toFixed(1);
    statsEl.innerHTML=`
      <div class="stat"><div class="stat-n">${results.length}</div><div class="stat-l">응시 인원</div></div>
      <div class="stat"><div class="stat-n">${avg}</div><div class="stat-l">평균 점수</div></div>
      <div class="stat"><div class="stat-n">${results[0].score||0}</div><div class="stat-l">최고 점수</div></div>`;

    listEl.innerHTML='';
    results.forEach((r,i)=>{
      const gc=r.pct>=92?'s':r.pct>=80?'a':r.pct>=60?'b':'c';
      const gl=r.pct>=92?'S':r.pct>=80?'A':r.pct>=60?'B':'C';
      const row=document.createElement('div');row.className='admin-row';
      row.innerHTML=`<div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:12px;color:var(--text-muted);min-width:20px">${i+1}</span>
        <div><div class="admin-name">${r.name}</div><div class="admin-date">${r.date||''}</div></div></div>
        <div style="display:flex;align-items:center">
          <span class="admin-score">${r.score!==undefined?r.score:'?'}점</span>
          <span class="admin-rank rank-${gc}">${gl}</span>
        </div>`;
      listEl.appendChild(row);
    });
  }catch(e){listEl.innerHTML='<div class="empty">데이터 불러오기 실패: '+e.message+'</div>';}
}

async function confirmClear(){
  if(!confirm('모든 응시 기록을 삭제하시겠습니까?'))return;
  try{
    await fetch(FIREBASE_URL+'/results.json',{method:'DELETE'});
    loadAdmin();
  }catch(e){alert('삭제 실패: '+e.message);}
}
</script>
</body>
</html>
