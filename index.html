<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테리스 주간평가</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#f0f4f1;color:#1a1a1a;min-height:100vh}
.screen{display:none;min-height:100vh}.screen.active{display:flex;flex-direction:column}

.main-header{background:#1a7350;padding:3rem 1.5rem 2.5rem;text-align:center;color:#fff}
.main-header .academy{font-size:13px;opacity:.7;letter-spacing:.08em;margin-bottom:10px}
.main-header h1{font-size:32px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
.main-header .subtitle{font-size:14px;opacity:.7;margin-top:10px}
.main-body{flex:1;padding:1.5rem 1rem 2rem;max-width:500px;margin:0 auto;width:100%}

.cat-card{display:flex;align-items:center;gap:1rem;background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:16px;padding:1.25rem 1.5rem;margin-bottom:14px;cursor:pointer;transition:all .18s;color:#1a1a1a}
.cat-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,115,80,.13);border-color:#1a7350}
.cat-card:active{transform:scale(.98)}
.cat-num{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;flex-shrink:0}
.n1{background:#1a7350}.n2{background:#2563eb}.n3{background:#d97706}
.cat-info{flex:1}
.cat-name{font-size:18px;font-weight:700;margin-bottom:3px}
.cat-desc{font-size:13px;color:#6b7280}
.cat-arrow{font-size:20px;color:#d1d5db;transition:transform .18s}
.cat-card:hover .cat-arrow{color:#1a7350;transform:translateX(3px)}
.main-footer{text-align:center;padding:1.5rem;font-size:12px;color:#9ca3af}

.list-header{padding:1rem 1.25rem;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid rgba(0,0,0,.07);position:sticky;top:0;z-index:10}
.back-btn{width:36px;height:36px;border-radius:10px;background:#f3f4f6;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.back-btn:hover{background:#e5e7eb}
.list-header-title{font-size:17px;font-weight:700}
.list-header-sub{font-size:12px;color:#6b7280;margin-top:1px}
.list-body{flex:1;padding:1rem;max-width:600px;margin:0 auto;width:100%}

.book-card{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:1.1rem 1.25rem;margin-bottom:10px;cursor:pointer;transition:all .15s}
.book-card:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.06);border-color:var(--c)}
.book-card:active{transform:scale(.99)}
.book-icon{width:42px;height:42px;border-radius:11px;background:var(--c-l);color:var(--c);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.book-info{flex:1}
.book-title{font-size:15px;font-weight:700;margin-bottom:2px}
.book-desc{font-size:12px;color:#6b7280}
.book-go{font-size:18px;color:#d1d5db}
.book-card:hover .book-go{color:var(--c)}

/* Level 카드 — 숫자 배지 스타일 */
.level-card .book-icon{font-weight:700;font-size:18px;font-family:'Apple SD Gothic Neo',sans-serif}

.test-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:14px;padding:1rem 1.25rem;margin-bottom:10px;text-decoration:none;color:#1a1a1a;transition:all .15s}
.test-item:hover{border-color:var(--c);box-shadow:0 3px 12px rgba(0,0,0,.06)}
.test-item:active{transform:scale(.99)}
.test-dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex-shrink:0;margin-top:2px}
.test-info{flex:1}
.test-title{font-size:15px;font-weight:600;margin-bottom:3px;line-height:1.4}
.test-meta{font-size:12px;color:#6b7280}
.test-go{font-size:18px;color:#d1d5db}
.test-item:hover .test-go{color:var(--c)}

.test-item.cumulative{background:linear-gradient(135deg,var(--c-l) 0%,#fff 100%);border:1.5px solid var(--c)}
.test-item.cumulative .test-title{color:var(--c-d)}
.test-item.cumulative .test-dot{background:var(--c-d);width:11px;height:11px}

.sec-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af;margin:1.25rem 4px .6rem;display:flex;align-items:center;gap:6px}
.sec-label:first-child{margin-top:0}

.adm-wrap{max-width:640px;margin:0 auto}
.adm-help{font-size:13px;color:#6b7280;background:#f0faf5;border:1px solid #c7e8d9;border-radius:10px;padding:10px 14px;margin-bottom:16px;line-height:1.6}
.adm-sec{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.adm-sec-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;margin-bottom:10px;gap:6px;flex-wrap:wrap}
.adm-chips{display:flex;flex-wrap:wrap;gap:7px}
.adm-chip{border:1.5px solid #d1d5db;background:#fff;border-radius:9px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;color:#374151}
.adm-chip.on{border-color:#1a7350;background:#e1f5ee;color:#0f6e56}
.adm-empty{font-size:13px;color:#9ca3af;padding:4px}
.adm-add{border:none;background:#1a7350;color:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.adm-mini{border:1px solid #d1d5db;background:#fff;color:#6b7280;border-radius:7px;padding:5px 9px;font-size:11.5px;cursor:pointer;font-family:inherit;margin-left:4px}
.adm-mini.del{color:#dc2626;border-color:#fecaca}
.adm-levels{display:flex;flex-direction:column;gap:8px}
.adm-level{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #e5e7eb;border-radius:11px;padding:10px 12px;flex-wrap:wrap}
.adm-level-info b{font-size:14.5px}
.adm-level-info span{font-size:12px;color:#9ca3af}
.adm-level-cnt{font-size:11.5px;color:#6b7280;margin-top:2px}
.adm-level-btns{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.adm-go{border:none;background:#d97706;color:#fff;border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.adm-go:hover{background:#b45309}
.adm-foot{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.adm-save{border:none;background:#1a7350;color:#fff;border-radius:10px;padding:12px 22px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.adm-logout{border:1px solid #d1d5db;background:#fff;color:#6b7280;border-radius:10px;padding:12px 18px;font-size:13px;cursor:pointer;font-family:inherit}
.admin-fab{position:fixed;right:16px;bottom:16px;z-index:60;background:#1a7350;color:#fff;border:none;border-radius:50px;padding:12px 18px;font-size:13.5px;font-weight:700;box-shadow:0 4px 14px rgba(26,115,80,.35);cursor:pointer;font-family:inherit;display:none}
.admin-fab.show{display:block}
.empty-box{background:#fff;border:1.5px dashed #d1d5db;border-radius:14px;padding:2.5rem 1rem;text-align:center;color:#9ca3af}
.empty-box .ei{font-size:32px;margin-bottom:10px}
.empty-box p{font-size:14px}

/* 정렬바 + 점수 배지 */
.sort-bar{display:flex;align-items:center;justify-content:space-between;margin:1.25rem 4px .6rem}
.sort-bar:first-child{margin-top:0}
.sort-btns{display:flex;gap:6px}
.sort-btn{font-size:12px;padding:5px 11px;border-radius:8px;border:1px solid rgba(0,0,0,.1);background:#fff;color:#6b7280;cursor:pointer;transition:all .15s}
.sort-btn:hover{background:#f9fafb}
.sort-btn.on{background:var(--c,#d97706);color:#fff;border-color:var(--c,#d97706);font-weight:600}
.score-badge{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:#16a34a;padding:3px 10px;border-radius:20px;white-space:nowrap}

<script>
let curCat = null, curGradeIdx = null, curBookIdx = null, curLevelIdx = null;
// 현재 위치의 교재 목록 (학년 구조면 해당 학년의 books, 아니면 카테고리 books)
function curBooks(){
  const cat = STRUCTURE[curCat];
  if(cat.grades) return (curGradeIdx!=null && cat.grades[curGradeIdx]) ? cat.grades[curGradeIdx].books : [];
  return cat.books || [];
}

// ── 점수 표시용 설정 ──
const FIREBASE_URL = "https://terrys-d643a-default-rtdb.firebaseio.com";
let sortMode = 'added';          // 'added'(업로드순) | 'name'(파일명순)
const scoreCache = {};           // db경로 → 해당 학생 최고점 (중복 조회 방지)

// 학생 이름: URL ?student= 또는 sessionStorage에서
function getStudent(){
  try{
    var p = new URLSearchParams(location.search).get('student');
    if(p) return p;
    return sessionStorage.getItem('terrys_embed_student') || '';
  }catch(e){ return ''; }
}

// 특정 평가지(db)에서 현재 학생의 최고점을 가져옴 (없으면 null)
async function fetchBestScore(db){
  const student = getStudent();
  if(!student || !db) return null;
  const key = db + '::' + student;
  if(key in scoreCache) return scoreCache[key];
  try{
    const r = await fetch(FIREBASE_URL + db);
    const data = await r.json();
    if(!data){ scoreCache[key] = null; return null; }
    let best = null;
    Object.values(data).forEach(rec=>{
      if(rec && rec.name === student && typeof rec.score === 'number'){
        if(best === null || rec.score > best) best = rec.score;
      }
    });
    scoreCache[key] = best;
    return best;
  }catch(e){ return null; }
}

// 이 파일의 원본 HTML 보관 (관리자 저장 시 STRUCTURE 주입용)
window.__INDEX_SRC__ = document.documentElement.outerHTML;
// 관리자가 이전에 편집한 구조가 있으면 복원 (저장 전 미리보기 용도)
(function(){
  try{
    const ov = JSON.parse(localStorage.getItem("terry_structure_override")||"null");
    if(ov && ov.reading){ for(const k in ov) STRUCTURE[k]=ov[k]; }
  }catch(e){}
})();

// HTML 특수문자 이스케이프 (관리자 화면·버튼 렌더링용)
function esc(t){
  return String(t==null?"":t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// 평가지 표시 이름: title이 있으면 그대로, 없으면 파일명에서 자동 추출
function testTitle(t){
  if(t.title) return t.title;                 // 직접 지정한 이름 우선
  if(!t.file || t.file==='#') return '평가지';
  return t.file.replace(/\.html?$/i,'')        // 확장자 제거
               .replace(/[_-]+/g,' ')          // _,- → 공백
               .trim();
}

function initCounts(){
  ['vocab','grammar','reading'].forEach(k=>{
    const cat = STRUCTURE[k];
    let txt;
    if(cat.grades){
      txt = cat.grades.length>0 ? cat.grades.length+'개 학년' : '등록된 학년 없음';
    }else{
      const n = (cat.books||[]).length;
      txt = n>0 ? n+'개 교재 등록됨' : '등록된 교재 없음';
    }
    document.getElementById('cnt-'+k).textContent = txt;
  });
}
initCounts();

// ── 카테고리 → (학년 목록) 또는 교재 폴더 목록 ──
function openCat(catKey){
  curCat = catKey;
  curGradeIdx = null;
  curBookIdx = null;
  curLevelIdx = null;
  const cat = STRUCTURE[catKey];

  // 학년 구조 (리딩): 학년 카드 먼저
  if(cat.grades){
    document.getElementById('books-title').textContent = cat.name;
    document.getElementById('books-sub').textContent = cat.grades.length>0 ? '학년을 선택하세요' : '등록된 학년 없음';
    const body = document.getElementById('books-body');
    if(!cat.grades.length){
      body.innerHTML = '<div class="empty-box"><div class="ei">📭</div><p>아직 등록된 학년이 없어요</p></div>';
    } else {
      body.innerHTML = cat.grades.map((g,idx)=>{
        const c = cat.color, cl = cat.colorLight;
        const desc = g.books.length>0 ? g.books.length+'개 출판사' : '준비중';
        return '<div class="book-card level-card" style="--c:'+c+';--c-l:'+cl+'" onclick="openGrade('+idx+')">' +
          '<div class="book-icon">'+(g.icon||'🎓')+'</div>' +
          '<div class="book-info"><div class="book-title">'+g.title+'</div><div class="book-desc">'+desc+'</div></div>' +
          '<span class="book-go">›</span></div>';
      }).join('');
    }
    show('s-books');
    return;
  }

  renderBookList(cat.name, cat.books||[]);
}

// ── 학년 클릭 → 그 학년의 출판사(교재) 목록 ──
function openGrade(gIdx){
  curGradeIdx = gIdx;
  curBookIdx = null;
  curLevelIdx = null;
  const cat = STRUCTURE[curCat];
  const grade = cat.grades[gIdx];
  renderBookList(cat.name+' · '+grade.title, grade.books, grade.books.length+'개 출판사');
}

// ── 교재 카드 목록 공용 렌더 ──
function renderBookList(title, books, subText){
  const cat = STRUCTURE[curCat];
  document.getElementById('books-title').textContent = title;
  document.getElementById('books-sub').textContent = subText || (books.length>0 ? books.length+'개 교재' : '등록된 교재 없음');
  const body = document.getElementById('books-body');
  if(!books.length){
    body.innerHTML = '<div class="empty-box"><div class="ei">📭</div><p>아직 등록된 자료가 없어요</p></div>';
  } else {
    body.innerHTML = books.map((b,idx)=>{
      const c = b.themeColor || cat.color;
      const cl = b.themeColorLight || cat.colorLight;
      const desc = (b.levels && b.levels.length) ? b.levels.map(l=>l.title).join(' · ') : (b.desc||'');
      return '<div class="book-card" style="--c:'+c+';--c-l:'+cl+'" onclick="openBook('+idx+')">' +
        '<div class="book-icon">'+b.icon+'</div>' +
        '<div class="book-info"><div class="book-title">'+b.title+'</div><div class="book-desc">'+desc+'</div></div>' +
        '<span class="book-go">›</span></div>';
    }).join('');
  }
  show('s-books');
}

// ── 교재 목록 화면 뒤로가기: 학년 목록 또는 메인 ──
function booksBack(){
  const cat = STRUCTURE[curCat];
  if(cat && cat.grades && curGradeIdx!=null){ openCat(curCat); return; }
  show('s-main');
}
function levelsBack(){
  const cat = STRUCTURE[curCat];
  if(cat && cat.grades) openGrade(curGradeIdx);
  else openCat(curCat);
}

// ── 교재 폴더 클릭 → Level 목록 OR 테스트 목록 ──
function openBook(bookIdx){
  const cat = STRUCTURE[curCat];
  const book = curBooks()[bookIdx];
  curBookIdx = bookIdx;
  curLevelIdx = null;

  // levels가 있는 폴더 (문마중 등) → Level 선택 화면
  if(book.levels && book.levels.length){
    const c = book.themeColor || cat.color;
    const cl = book.themeColorLight || cat.colorLight;
    document.getElementById('levels-title').textContent = book.title;
    document.getElementById('levels-sub').textContent = book.desc;

    const body = document.getElementById('levels-body');
    body.innerHTML = book.levels.map((lv,idx)=>
      '<div class="book-card level-card" style="--c:'+c+';--c-l:'+cl+'" onclick="openLevel('+idx+')">' +
      '<div class="book-icon">'+(lv.icon||book.icon)+'</div>' +
      '<div class="book-info"><div class="book-title">'+lv.title+'</div><div class="book-desc">'+lv.desc+'</div></div>' +
      '<span class="book-go">›</span></div>'
    ).join('');
    show('s-levels');
    return;
  }

  // levels가 없는 폴더 → 바로 테스트 목록
  renderTests(book);
}

// ── Level 클릭 → 해당 Level의 테스트 목록 ──
function openLevel(lvIdx){
  const cat = STRUCTURE[curCat];
  const book = curBooks()[curBookIdx];
  const level = book.levels[lvIdx];
  curLevelIdx = lvIdx;

  // Level을 book처럼 다루되, theme color는 부모 book에서 상속
  renderTests({
    title: book.title + ' — ' + level.title,
    desc: level.desc,
    cumulative: level.cumulative,
    tests: level.tests,
    themeColor: book.themeColor,
    themeColorLight: book.themeColorLight,
    themeColorDark: book.themeColorDark
  });
}

// ── 테스트 목록 렌더링 (book 또는 level에서 공용) ──
function renderTests(book){
  const cat = STRUCTURE[curCat];
  const c = book.themeColor || cat.color;
  const cl = book.themeColorLight || cat.colorLight;
  const cd = book.themeColorDark || cat.colorDark;

  document.getElementById('tests-title').textContent = book.title;
  document.getElementById('tests-sub').textContent = book.desc;

  let html = '<div style="--c:'+c+';--c-l:'+cl+';--c-d:'+cd+'">';

  if(book.cumulative){
    html += '<div class="sec-label">누적 테스트</div>';
    html += '<a href="'+book.cumulative.file+'" class="test-item cumulative">' +
      '<div class="test-dot"></div>' +
      '<div class="test-info"><div class="test-title">'+book.cumulative.title+'</div><div class="test-meta">'+book.cumulative.info+'</div></div>' +
      '<span class="test-go">›</span></a>';
  }

  if(book.tests && book.tests.length){
    const sectionLabel = curCat === 'vocab' ? '회차별 테스트' : (curCat === 'reading' ? '평가지' : '챕터별 테스트');

    // 리딩에서만 정렬 토글 표시
    if(curCat === 'reading'){
      html += '<div class="sort-bar">'+
        '<span class="sec-label" style="margin:0">'+sectionLabel+'</span>'+
        '<div class="sort-btns">'+
          '<button class="sort-btn'+(sortMode==='added'?' on':'')+'" onclick="setSort(\'added\')">업로드순</button>'+
          '<button class="sort-btn'+(sortMode==='name'?' on':'')+'" onclick="setSort(\'name\')">이름순</button>'+
        '</div></div>';
    } else {
      html += '<div class="sec-label">'+sectionLabel+'</div>';
    }

    // 정렬: 원본 순서를 보존하기 위해 인덱스 동봉 후 정렬
    let list = book.tests.map((t,i)=>({t, i}));
    if(sortMode === 'name'){
      list.sort((a,b)=> testTitle(a.t).localeCompare(testTitle(b.t), 'ko'));
    } else { // added(업로드순): added 필드 우선, 없으면 원래 순서
      list.sort((a,b)=>{
        const av = (typeof a.t.added==='number')?a.t.added:a.i+1;
        const bv = (typeof b.t.added==='number')?b.t.added:b.i+1;
        return av - bv;
      });
    }

    html += list.map(({t})=>{
      const ready = t.file && t.file !== '#';
      // 점수 배지 자리: db가 있으면 나중에 채움
      const sid = t.db ? ('sc-'+t.db.replace(/[^a-z0-9]/gi,'')) : '';
      const goCell = ready
        ? (t.db ? '<span class="test-go" id="'+sid+'">›</span>' : '<span class="test-go">›</span>')
        : '<span class="test-go">🔒</span>';
      if(ready){
        return '<a href="'+t.file+'" class="test-item">' +
          '<div class="test-dot"></div>' +
          '<div class="test-info"><div class="test-title">'+testTitle(t)+'</div><div class="test-meta">'+t.info+'</div></div>' +
          goCell+'</a>';
      }
      return '<div class="test-item" style="opacity:.55;cursor:not-allowed" onclick="alert(\'아직 자료가 준비되지 않았습니다.\')">' +
        '<div class="test-dot" style="background:#d1d5db"></div>' +
        '<div class="test-info"><div class="test-title">'+testTitle(t)+'</div><div class="test-meta">'+t.info+'</div></div>' +
        goCell+'</div>';
    }).join('');
  }

  // 관리자: 이 과에 PDF로 바로 시험 추가
  if(ADMIN && curCat==='reading' && STRUCTURE[curCat].grades){
    const g = STRUCTURE.reading.grades[curGradeIdx];
    const bk = g && g.books[curBookIdx];
    const lv = (bk && curLevelIdx!=null) ? bk.levels[curLevelIdx] : null;
    if(g && bk && lv){
      html += '<button class="adm-go" style="width:100%;margin-top:14px;padding:13px" '+
        'onclick="adminAddHere()">📄 이 과에 PDF로 시험 만들기 ('+esc(g.title)+' · '+esc(bk.title)+' · '+esc(lv.title)+')</button>';
    }
  }
  html += '</div>';
  document.getElementById('tests-body').innerHTML = html;
  show('s-tests');

  // 점수 비동기 로딩 → 우측 끝에 표시
  if(book.tests){
    book.tests.forEach(t=>{
      if(!t.db || t.file==='#') return;
      const sid = 'sc-'+t.db.replace(/[^a-z0-9]/gi,'');
      fetchBestScore(t.db).then(score=>{
        const el = document.getElementById(sid);
        if(!el) return;
        if(score===null){ el.textContent='›'; }
        else { el.innerHTML='<span class="score-badge">'+score+'점</span>'; }
      });
    });
  }
}

function adminAddHere(){
  const g = STRUCTURE.reading.grades[curGradeIdx];
  const bk = g.books[curBookIdx];
  const lv = bk.levels[curLevelIdx];
  // 현재 구조 저장(브라우저) — pdf2quiz가 병합 베이스로 fetch함
  saveStructureLocal();
  const params = new URLSearchParams({ cat:'reading', grade:g.title, book:bk.title, level:lv.title });
  location.href = 'pdf2quiz.html?'+params.toString();
}
function setSort(mode){
  sortMode = mode;
  // 현재 보고 있는 화면을 다시 그림
  if(curLevelIdx !== null){ openLevel(curLevelIdx); }
  else if(curBookIdx !== null){ openBook(curBookIdx); }
}

// ── 테스트 화면 뒤로가기: Level에서 왔으면 Level 목록으로, 아니면 책 목록으로 ──
// ── 관리자 도구(PDF → 시험 변환기) 진입 ──
let ADMIN = false;
try{ ADMIN = sessionStorage.getItem("terry_admin")==="1"; }catch(e){}
function openTeacherTool(){
  if(typeof openAdminMenu !== "function" || !document.getElementById("s-admin")){
    alert("⚠ 이전 버전이 캐시에 남아 있어요.\nCtrl+Shift+R(강력 새로고침)을 누른 뒤 다시 시도해 주세요.");
    return;
  }
  const pw = prompt("관리자 비밀번호");
  if(pw === null) return;
  if(pw !== "terry2025"){ alert("비밀번호가 틀렸습니다."); return; }
  ADMIN = true;
  try{ sessionStorage.setItem("terry_admin","1"); }catch(e){}
  openAdminMenu();
}
function adminLogout(){
  ADMIN = false;
  try{ sessionStorage.removeItem("terry_admin"); }catch(e){}
  var f=document.getElementById("adminFab"); if(f) f.classList.remove("show");
  initCounts(); show('s-main');
}

/* ════════ 관리자: 학년/출판사/과 설정 페이지 ════════ */
let admSel = { grade:0, book:0 };
function saveStructureLocal(){
  try{ localStorage.setItem("terry_structure_override", JSON.stringify(STRUCTURE)); }catch(e){}
}
function openAdminMenu(){
  admSel = { grade:0, book:0 };
  renderAdminMenu();
  show('s-admin');
  var f=document.getElementById("adminFab"); if(f) f.classList.add("show");
}
function admPalette(i){
  const P=[["#dc2626","#fee2e2","#991b1b"],["#16a34a","#dcfce7","#15803d"],
    ["#d97706","#fef3c7","#92400e"],["#2563eb","#dbeafe","#1d4ed8"],
    ["#9333ea","#f3e8ff","#6b21a8"],["#0d9488","#ccfbf1","#0f766e"]];
  return P[i % P.length];
}
function renderAdminMenu(){
  const R = STRUCTURE.reading;
  R.grades = R.grades || [];
  if(admSel.grade >= R.grades.length) admSel.grade = Math.max(0, R.grades.length-1);
  const grade = R.grades[admSel.grade] || null;
  const books = grade ? (grade.books||[]) : [];
  if(admSel.book >= books.length) admSel.book = Math.max(0, books.length-1);
  const book = books[admSel.book] || null;
  const levels = book ? (book.levels||[]) : [];

  let h = '<div class="adm-wrap">';
  h += '<p class="adm-help">리딩 테스트의 <b>학년 → 출판사 → 과</b>를 만들고 정리하세요. '+
       '과 안으로 들어가면 PDF로 시험을 바로 만들 수 있어요.</p>';

  // 학년
  h += '<div class="adm-sec"><div class="adm-sec-head"><span>📚 학년</span>'+
       '<button class="adm-add" onclick="admAdd(\'grade\')">+ 학년 추가</button></div><div class="adm-chips">';
  h += R.grades.map((g,i)=>
    '<button class="adm-chip'+(i===admSel.grade?' on':'')+'" onclick="admPick(\'grade\','+i+')">'+
    esc(g.title)+'</button>').join('');
  if(!R.grades.length) h += '<span class="adm-empty">학년을 추가하세요 (예: 중2)</span>';
  h += '</div></div>';

  // 출판사
  if(grade){
    h += '<div class="adm-sec"><div class="adm-sec-head"><span>🏫 '+esc(grade.title)+' 의 출판사</span>'+
         '<span><button class="adm-mini" onclick="admRen(\'grade\')">이름변경</button>'+
         '<button class="adm-mini del" onclick="admDel(\'grade\')">학년삭제</button>'+
         '<button class="adm-add" onclick="admAdd(\'book\')">+ 출판사</button></span></div><div class="adm-chips">';
    h += books.map((b,i)=>
      '<button class="adm-chip'+(i===admSel.book?' on':'')+'" onclick="admPick(\'book\','+i+')">'+
      esc(b.title)+'</button>').join('');
    if(!books.length) h += '<span class="adm-empty">출판사를 추가하세요 (예: 동아 (윤정미))</span>';
    h += '</div></div>';
  }

  // 과
  if(book){
    h += '<div class="adm-sec"><div class="adm-sec-head"><span>📖 '+esc(book.title)+' 의 과</span>'+
         '<span><button class="adm-mini" onclick="admRen(\'book\')">이름변경</button>'+
         '<button class="adm-mini del" onclick="admDel(\'book\')">출판사삭제</button>'+
         '<button class="adm-add" onclick="admAdd(\'level\')">+ 과</button></span></div>';
    h += '<div class="adm-levels">';
    h += levels.map((lv,i)=>{
      const cnt = (lv.tests||[]).filter(t=>t.file&&t.file!=='#').length;
      return '<div class="adm-level">'+
        '<div class="adm-level-info"><b>'+esc(lv.title)+'</b>'+(lv.desc?' <span>'+esc(lv.desc)+'</span>':'')+
          '<div class="adm-level-cnt">시험 '+cnt+'개</div></div>'+
        '<div class="adm-level-btns">'+
          '<button class="adm-go" onclick="adminEnterLevel('+i+')">📄 PDF로 시험 만들기</button>'+
          '<button class="adm-mini" onclick="admRenLevel('+i+')">이름</button>'+
          '<button class="adm-mini del" onclick="admDelLevel('+i+')">삭제</button>'+
        '</div></div>';
    }).join('');
    if(!levels.length) h += '<div class="adm-empty" style="padding:10px">과를 추가하세요 (예: Lesson 3)</div>';
    h += '</div></div>';
  }

  h += '<div class="adm-foot">'+
    '<button class="adm-save" onclick="admDownloadIndex()">💾 변경사항 저장 (index.html 받기)</button>'+
    '<button class="adm-logout" onclick="adminLogout()">관리자 종료</button></div>';
  h += '</div>';
  document.getElementById('admin-body').innerHTML = h;
}
function admPick(kind,i){
  if(kind==='grade'){ admSel.grade=i; admSel.book=0; }
  else if(kind==='book'){ admSel.book=i; }
  renderAdminMenu();
}
function admAdd(kind){
  const R = STRUCTURE.reading; R.grades = R.grades||[];
  if(kind==='grade'){
    const t = prompt("새 학년 이름 (예: 중2)"); if(!t||!t.trim()) return;
    R.grades.push({ title:t.trim(), icon:(t.match(/\d+/)||['🎓'])[0], books:[] });
    admSel.grade = R.grades.length-1; admSel.book=0;
  } else if(kind==='book'){
    const g = R.grades[admSel.grade]; if(!g){ alert("먼저 학년을 추가하세요."); return; }
    const t = prompt("새 출판사 이름 (예: 동아 (윤정미))"); if(!t||!t.trim()) return;
    const p = admPalette(g.books.length);
    g.books.push({ id:'bk_'+Date.now().toString(36), icon:'📘', title:t.trim(),
      themeColor:p[0], themeColorLight:p[1], themeColorDark:p[2], levels:[] });
    admSel.book = g.books.length-1;
  } else if(kind==='level'){
    const b = R.grades[admSel.grade].books[admSel.book]; if(!b){ alert("먼저 출판사를 추가하세요."); return; }
    b.levels = b.levels||[];
    const t = prompt("새 과 이름 (예: Lesson 3)"); if(!t||!t.trim()) return;
    const d = prompt("과 부제 (단원 제목 — 생략 가능)")||"";
    b.levels.push({ icon:(t.match(/\d+/)||['•'])[0], title:t.trim(), desc:d.trim(), tests:[] });
  }
  saveStructureLocal(); renderAdminMenu();
}
function admRen(kind){
  const R = STRUCTURE.reading;
  const node = kind==='grade' ? R.grades[admSel.grade] : R.grades[admSel.grade].books[admSel.book];
  if(!node) return;
  const t = prompt("새 이름", node.title); if(!t||!t.trim()) return;
  node.title = t.trim();
  if(kind==='grade') node.icon=(node.title.match(/\d+/)||[node.icon||'🎓'])[0];
  saveStructureLocal(); renderAdminMenu();
}
function admRenLevel(i){
  const lv = STRUCTURE.reading.grades[admSel.grade].books[admSel.book].levels[i]; if(!lv) return;
  const t = prompt("과 이름", lv.title); if(!t||!t.trim()) return;
  lv.title = t.trim();
  const d = prompt("부제 (비우면 유지)", lv.desc||""); if(d!==null) lv.desc=d.trim();
  saveStructureLocal(); renderAdminMenu();
}
function realTestCount(tests){ return (tests||[]).filter(t=>t.file&&t.file!=='#').length; }
function admDel(kind){
  const R = STRUCTURE.reading;
  if(kind==='grade'){
    const g = R.grades[admSel.grade]; if(!g) return;
    const cnt = (g.books||[]).reduce((a,b)=>a+(b.levels||[]).reduce((x,l)=>x+realTestCount(l.tests),0),0);
    if(cnt>0){ alert("이 학년에 시험이 "+cnt+"개 있어요. 먼저 비워 주세요."); return; }
    if(!confirm('"'+g.title+'" 학년을 삭제할까요?')) return;
    R.grades.splice(admSel.grade,1); admSel.grade=0; admSel.book=0;
  } else if(kind==='book'){
    const b = R.grades[admSel.grade].books[admSel.book]; if(!b) return;
    const cnt = (b.levels||[]).reduce((x,l)=>x+realTestCount(l.tests),0);
    if(cnt>0){ alert("이 출판사에 시험이 "+cnt+"개 있어요. 먼저 비워 주세요."); return; }
    if(!confirm('"'+b.title+'" 을(를) 삭제할까요?')) return;
    R.grades[admSel.grade].books.splice(admSel.book,1); admSel.book=0;
  }
  saveStructureLocal(); renderAdminMenu();
}
function admDelLevel(i){
  const b = STRUCTURE.reading.grades[admSel.grade].books[admSel.book];
  const lv = b.levels[i]; if(!lv) return;
  if(realTestCount(lv.tests)>0){ alert("이 과에 시험이 있어요. 먼저 비워 주세요."); return; }
  if(!confirm('"'+lv.title+'" 과를 삭제할까요?')) return;
  b.levels.splice(i,1); saveStructureLocal(); renderAdminMenu();
}
// 과 진입 → pdf2quiz로 경로 전달
function adminEnterLevel(i){
  const g = STRUCTURE.reading.grades[admSel.grade];
  const b = g.books[admSel.book];
  const lv = b.levels[i];
  admDownloadIndex(true); // 구조 먼저 저장(조용히)
  const params = new URLSearchParams({
    cat:'reading', grade:g.title, book:b.title, level:lv.title
  });
  location.href = 'pdf2quiz.html?'+params.toString();
}
function admDownloadIndex(silent){
  const out = buildIndexFromStructure();
  saveStructureLocal();
  if(!silent){
    downloadIndexFile(out);
    alert("변경된 index.html을 받았습니다.\nH:\\terrysquiz\\ 에 덮어쓰면 학생 메뉴에 반영돼요.");
  }
}
function downloadIndexFile(txt){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/html;charset=utf-8'}));
  a.download='index.html'; a.click();
}
// 현재 STRUCTURE를 이 파일 원본에 주입해 새 index.html 문자열 생성
function buildIndexFromStructure(){
  const src = window.__INDEX_SRC__ || document.documentElement.outerHTML;
  const at = src.indexOf('const STRUCTURE');
  if(at<0) return src;
  const b0 = src.indexOf('{', at);
  let i=b0, depth=0, q=null;
  for(; i<src.length; i++){
    const ch=src[i];
    if(q){ if(ch==='\\') i++; else if(ch===q) q=null; continue; }
    if(ch==="'"||ch==='"'||ch==='`'){ q=ch; continue; }
    if(ch==='{') depth++;
    else if(ch==='}'){ depth--; if(depth===0){ i++; break; } }
  }
  let end=i; if(src[end]===';') end++;
  return src.slice(0,at) + 'const STRUCTURE = ' + JSON.stringify(STRUCTURE,null,2) + ';' + src.slice(end);
}

function goBackFromTests(){
  if(curLevelIdx !== null){
    openBook(curBookIdx);
  } else if(STRUCTURE[curCat].grades && curGradeIdx!=null){
    openGrade(curGradeIdx);
  } else {
    openCat(curCat);
  }
}
