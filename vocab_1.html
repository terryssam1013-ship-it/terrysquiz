<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수능만만 단어테스트 — 1회</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#f4f6f4;color:#1a1a1a;min-height:100vh}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}
:root{--green:#1a7350;--green-l:#e1f5ee;--green-d:#0f6e56;--blue:#2563eb;--blue-l:#dbeafe;--red:#a32d2d;--red-l:#fef2f2}

/* Header */
.hdr{background:var(--green);padding:1.25rem 1.5rem;color:#fff}
.hdr-row{display:flex;align-items:center;justify-content:space-between}
.hdr-sub{font-size:12px;opacity:.7;margin-bottom:3px}
.hdr-title{font-size:19px;font-weight:700}

/* Card */
.body{flex:1;padding:1.25rem 1rem 2rem;max-width:620px;margin:0 auto;width:100%}
.card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:1.5rem}

/* Input */
label{font-size:14px;font-weight:500;display:block;margin-bottom:6px}
input[type=text]{width:100%;padding:11px 14px;font-size:15px;border:1px solid rgba(0,0,0,.15);border-radius:8px;background:#fff;margin-bottom:14px}
input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(26,115,80,.12)}

/* Buttons */
.btn{display:block;width:100%;padding:12px;font-size:15px;font-weight:600;border-radius:9px;border:none;cursor:pointer;transition:all .15s}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:var(--green-d)}
.btn-outline{background:#fff;color:#6b7280;border:1px solid rgba(0,0,0,.12);margin-top:8px;font-weight:500}
.btn-outline:hover{background:#f9fafb}
.btn-sm{padding:7px 13px;font-size:12px;width:auto;display:inline-block;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;cursor:pointer}

/* Progress */
.prog-wrap{margin-bottom:1.25rem}
.prog-bar{height:7px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin:5px 0 3px}
.prog-fill{height:100%;border-radius:4px;transition:width .3s}
.fill-en{background:var(--green)}
.fill-ko{background:var(--blue)}
.prog-info{display:flex;justify-content:space-between;font-size:12px;color:#6b7280}

/* Type badge */
.type-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:12px}
.badge-en{background:var(--green-l);color:var(--green-d)}
.badge-ko{background:var(--blue-l);color:var(--blue)}

/* Prompt */
.prompt-box{background:#f8fafb;border:1.5px solid rgba(0,0,0,.08);border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:1.25rem}
.prompt-word{font-size:26px;font-weight:700;color:var(--green);letter-spacing:.5px}
.prompt-meaning{font-size:22px;font-weight:600;color:#1a1a1a}
.prompt-hint{font-size:12px;color:#9ca3af;margin-top:6px}

/* Choices */
.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:1.25rem}
.choice{text-align:left;padding:12px 16px;border:1px solid rgba(0,0,0,.1);border-radius:10px;background:#fff;color:#1a1a1a;cursor:pointer;font-size:14px;font-weight:500;transition:all .15s}
.choice:hover{border-color:var(--green);background:var(--green-l)}
.choice.sel{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.choice.correct{border-color:#16a34a;background:#f0fdf4;color:#166534}
.choice.wrong{border-color:#dc2626;background:var(--red-l);color:var(--red)}

/* Nav */
.nav{display:flex;gap:8px}
.nav-btn{flex:1;padding:11px;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid rgba(0,0,0,.1);background:#f3f4f6;color:#6b7280;transition:all .15s}
.nav-btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.nav-btn:hover:not(:disabled){opacity:.85}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}

/* Score */
.score-wrap{text-align:center;padding:1.5rem 0 1rem}
.score-ring{width:130px;height:130px;border-radius:50%;background:var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 1rem;color:#fff}
.s-num{font-size:40px;font-weight:700;line-height:1}
.s-tot{font-size:14px;opacity:.75;margin-top:2px}
.s-grade{font-size:22px;font-weight:700;color:var(--green);margin-bottom:4px}
.s-msg{font-size:13px;color:#6b7280}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin:.75rem 0}
.stat{background:#f8fafb;border-radius:9px;padding:.75rem;text-align:center}
.stat-n{font-size:22px;font-weight:700;color:var(--green)}
.stat-n.red{color:var(--red)}
.stat-n.blue{color:var(--blue)}
.stat-l{font-size:11px;color:#6b7280;margin-top:2px}

/* Review */
.sec-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9ca3af;margin:1.25rem 0 .5rem;padding-bottom:4px;border-bottom:1px solid #e5e7eb}
.rv-item{display:flex;gap:10px;padding:9px 11px;border-radius:9px;margin-bottom:6px;font-size:13px;align-items:flex-start}
.rv-ok{background:#f0fdf4;border:1px solid #bbf7d0}
.rv-ng{background:var(--red-l);border:1px solid #fecaca}
.rv-icon{font-size:14px;margin-top:1px;flex-shrink:0}
.rv-body{flex:1;line-height:1.5}
.rv-ans{font-size:11px;color:var(--red);margin-top:2px}

/* Admin */
.admin-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.admin-row:last-child{border-bottom:none}
.a-name{font-weight:600}
.a-date{font-size:11px;color:#9ca3af;margin-top:1px}
.a-score{font-weight:700;color:var(--green);font-size:15px;margin-right:8px}
.rank{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
.rs{background:var(--green-l);color:var(--green-d)}
.ra{background:var(--blue-l);color:var(--blue)}
.rb{background:#fef3c7;color:#92400e}
.rc{background:var(--red-l);color:var(--red)}
.empty{text-align:center;padding:2.5rem;color:#9ca3af;font-size:14px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(26,115,80,.2);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:999;padding:1rem}
.modal{background:#fff;border-radius:14px;padding:1.5rem;width:100%;max-width:320px}
.modal h3{font-size:16px;font-weight:700;margin-bottom:1rem}
.m-btns{display:flex;gap:8px;margin-top:1rem}
.m-btns button{flex:1;padding:10px;border-radius:8px;font-size:14px;cursor:pointer;border:1px solid rgba(0,0,0,.1);background:#f3f4f6;color:#1a1a1a}
.m-btns button.ok{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}
.err{font-size:12px;color:var(--red);min-height:16px;margin-top:4px}
.save-status{font-size:12px;color:#6b7280;text-align:center;margin:.5rem 0}
</style>
</head>
<body>

<!-- LANDING -->
<div id="s-landing" class="screen active">
  <div class="hdr">
    <div class="hdr-sub">수능만만 기본독해 10+1 · 1회</div>
    <div class="hdr-title">단어 테스트</div>
  </div>
  <div class="body">
    <div class="card">
      <p style="font-size:13px;color:#6b7280;margin-bottom:.75rem">60문항 · 5지선다 · 영→한 30문 + 한→영 30문</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.25rem">
        <div style="background:var(--green-l);border-radius:9px;padding:.75rem;text-align:center">
          <div style="font-size:18px;font-weight:700;color:var(--green)">30</div>
          <div style="font-size:11px;color:var(--green-d)">영어 → 한국어</div>
        </div>
        <div style="background:var(--blue-l);border-radius:9px;padding:.75rem;text-align:center">
          <div style="font-size:18px;font-weight:700;color:var(--blue)">30</div>
          <div style="font-size:11px;color:var(--blue)">한국어 → 영어</div>
        </div>
      </div>
      <label>이름</label>
      <input type="text" id="name-in" placeholder="예) 홍길동" autocomplete="off">
      <button class="btn btn-green" onclick="startQuiz()">테스트 시작 →</button>
      <button class="btn btn-outline" onclick="openModal()">관리자 로그인</button>
    </div>
  </div>
</div>

<!-- QUIZ -->
<div id="s-quiz" class="screen">
  <div class="hdr hdr-row">
    <div>
      <div class="hdr-sub" id="qz-name"></div>
      <div class="hdr-title" style="font-size:15px">단어 테스트 · 1회</div>
    </div>
    <span id="qz-cnt" style="font-size:13px;opacity:.8"></span>
  </div>
  <div class="body">
    <div class="card">
      <div class="prog-wrap">
        <div class="prog-info"><span id="prog-txt"></span><span id="prog-pct"></span></div>
        <div class="prog-bar"><div id="prog-fill" class="prog-fill fill-en" style="width:0%"></div></div>
      </div>
      <span id="q-badge" class="type-badge badge-en"></span>
      <div id="prompt-box" class="prompt-box"></div>
      <div id="choices" class="choices"></div>
      <div class="nav">
        <button class="nav-btn" id="btn-prev" onclick="nav(-1)">← 이전</button>
        <button class="nav-btn primary" id="btn-next" onclick="navNext()">다음 →</button>
      </div>
    </div>
  </div>
</div>

<!-- RESULT -->
<div id="s-result" class="screen">
  <div class="hdr">
    <div class="hdr-sub">테스트 완료</div>
    <div class="hdr-title" id="res-name"></div>
  </div>
  <div class="body">
    <div class="card">
      <div class="score-wrap">
        <div class="score-ring">
          <span class="s-num" id="res-score"></span>
          <span class="s-tot">/ 60</span>
        </div>
        <div class="s-grade" id="res-grade"></div>
        <div class="s-msg" id="res-msg"></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="stat-n" id="st-ok"></div><div class="stat-l">정답</div></div>
        <div class="stat"><div class="stat-n red" id="st-ng"></div><div class="stat-l">오답</div></div>
        <div class="stat"><div class="stat-n blue" id="st-en"></div><div class="stat-l">영→한</div></div>
        <div class="stat"><div class="stat-n" id="st-ko"></div><div class="stat-l">한→영</div></div>
      </div>
      <div id="retake-box" style="display:none;background:#fef2f2;border:1.5px solid #fecaca;border-radius:10px;padding:14px 16px;margin:1rem 0;text-align:center;color:#991b1b;font-weight:600;font-size:14px;line-height:1.5">⚠️ <strong>80점 미만입니다.</strong><br><span style="font-weight:500;font-size:13px">단어를 다시 외운 후 재응시해주세요.</span></div><div id="pass-box" style="display:none;background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:10px;padding:12px 16px;margin:1rem 0;text-align:center;color:#166534;font-weight:600;font-size:14px">🎉 합격! 80점 이상 통과했습니다.</div>
      <div class="save-status" id="save-st"></div>
      <div class="sec-lbl">오답 목록</div>
      <div id="review"></div>
      <button class="btn btn-outline" style="margin-top:1rem" onclick="goHome()">처음으로</button>
    </div>
  </div>
</div>

<!-- ADMIN -->
<div id="s-admin" class="screen">
  <div class="hdr hdr-row">
    <div><div class="hdr-sub">관리자 패널</div><div class="hdr-title">학생 성적 현황</div></div>
    <button class="btn-sm" onclick="confirmClear()">초기화</button>
  </div>
  <div class="body">
    <div class="card">
      <div class="stats" id="adm-stats"></div>
      <div class="sec-lbl">응시 학생 목록</div>
      <div id="adm-list"></div>
      <button class="btn btn-outline" style="margin-top:1rem" onclick="goHome()">← 나가기</button>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="modal-bg" style="display:none">
  <div class="modal">
    <h3>관리자 비밀번호</h3>
    <input type="password" id="adm-pw" placeholder="비밀번호"
      style="width:100%;padding:10px 14px;font-size:15px;border:1px solid rgba(0,0,0,.15);border-radius:8px;background:#fff;margin-bottom:4px">
    <div class="err" id="pw-err"></div>
    <div class="m-btns">
      <button onclick="closeModal()">취소</button>
      <button class="ok" onclick="checkPw()">로그인</button>
    </div>
  </div>
</div>

  {min:48,g:"A",label:"A — 우수",msg:"단어 암기가 잘 됐습니다!"},

let studentName='', ans=new Array(TOTAL).fill(-1), cur=0;

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('s-'+id).classList.add('active');}
function goHome(){document.getElementById('name-in').value='';show('landing');}

function startQuiz(){
  studentName=document.getElementById('name-in').value.trim();
  if(!studentName){alert('이름을 입력해주세요.');return;}
  ans=new Array(TOTAL).fill(-1);cur=0;
  document.getElementById('qz-name').textContent=studentName;
  render(0);show('quiz');
}

function render(i){
  const q=Q[i];
  const pct=Math.round(i/TOTAL*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-fill').className='prog-fill '+(q.type==='en_ko'?'fill-en':'fill-ko');
  document.getElementById('prog-txt').textContent=(i+1)+' / '+TOTAL;
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('qz-cnt').textContent=(i+1)+'/'+TOTAL;

  const badge=document.getElementById('q-badge');
  if(q.type==='en_ko'){badge.textContent='영어 → 한국어';badge.className='type-badge badge-en';}
  else{badge.textContent='한국어 → 영어';badge.className='type-badge badge-ko';}

  const pb=document.getElementById('prompt-box');
  if(q.type==='en_ko'){
    pb.innerHTML=`<div class="prompt-word">${q.prompt}</div><div class="prompt-hint">이 단어의 뜻은?</div>`;
  }else{
    pb.innerHTML=`<div class="prompt-meaning">${q.prompt}</div><div class="prompt-hint">이 뜻에 해당하는 영어 단어는?</div>`;
  }

  const el=document.getElementById('choices');
  el.innerHTML='';
  q.choices.forEach((c,ci)=>{
    const b=document.createElement('button');
    b.className='choice'+(ans[i]===ci?' sel':'');
    b.textContent=c;
    b.onclick=()=>pick(i,ci);
    el.appendChild(b);
  });

  document.getElementById('btn-prev').disabled=i===0;
  document.getElementById('btn-next').textContent=i===TOTAL-1?'제출 →':'다음 →';
}

function pick(qi,ci){
  ans[qi]=ci;
  document.getElementById('choices').querySelectorAll('.choice').forEach((b,i)=>{
    b.classList.toggle('sel',i===ci);
  });
}

function nav(d){cur=Math.max(0,Math.min(TOTAL-1,cur+d));render(cur);}

function navNext(){
  if(cur===TOTAL-1){
    const empty=ans.filter(a=>a===-1).length;
    if(empty>0&&!confirm(`${empty}문항을 풀지 않았습니다. 제출할까요?`))return;
    submit();
  }else{nav(1);}
}

async function submit(){
  const score=ans.filter((a,i)=>a===Q[i].answer).length;
  const enScore=ans.slice(0,30).filter((a,i)=>a===Q[i].answer).length;
  
  const enOk=Q.slice(0,30).filter((q,i)=>ans[i]===q.answer).length;
  const koOk=Q.slice(30,60).filter((q,i)=>ans[i+30]===q.answer).length;
  const pct=Math.round(score/TOTAL*100);
  const grade=GRADES.find(g=>score>=g.min);

  document.getElementById('res-name').textContent=studentName+'님의 결과';
  document.getElementById('res-score').textContent=score;
  document.getElementById('res-grade').textContent=grade.label;
  document.getElementById('res-msg').textContent=grade.msg;
  document.getElementById('st-ok').textContent=score;
  document.getElementById('st-ng').textContent=TOTAL-score;
  document.getElementById('st-en').textContent=enOk+'/30';
  document.getElementById('st-ko').textContent=koOk+'/30';

  const rv=document.getElementById('review');rv.innerHTML='';
  let ngCount=0;
  Q.forEach((q,i)=>{
    if(ans[i]!==q.answer){
      ngCount++;
      const d=document.createElement('div');
      d.className='rv-item rv-ng';
      d.innerHTML=`<span class="rv-icon">✗</span>
        <div class="rv-body">
          <strong>${i+1}번</strong> <em>${q.prompt}</em>
          <div class="rv-ans">내 답: ${ans[i]>=0?q.choices[ans[i]]:'미응답'} → 정답: ${q.choices[q.answer]}</div>
        </div>`;
      rv.appendChild(d);
    }
  });
  if(ngCount===0)rv.innerHTML='<div style="text-align:center;padding:1.5rem;color:#1a7350;font-weight:600">전부 정답! 🎉</div>';


  // 재시험/합격 안내
  if(pct >= 80){
    document.getElementById('pass-box').style.display='block';
    document.getElementById('retake-box').style.display='none';
  } else {
    document.getElementById('pass-box').style.display='none';
    document.getElementById('retake-box').style.display='block';
  }

  show('result');

  const stEl=document.getElementById('save-st');
  stEl.innerHTML='<span class="spinner"></span>점수 저장 중...';
  try{
    const payload={name:studentName,score,total:TOTAL,pct,grade:grade.g,enOk,koOk,date:new Date().toLocaleString('ko-KR'),ts:Date.now(),testId:'vocab_1'};
    const r=await fetch(FIREBASE_URL+'/results.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    stEl.innerHTML=r.ok?'<span style="color:var(--green)">✓ 점수 저장 완료</span>':'저장 실패';
  }catch(e){stEl.textContent='저장 실패: '+e.message;}
}

function openModal(){document.getElementById('adm-pw').value='';document.getElementById('pw-err').textContent='';document.getElementById('modal').style.display='flex';setTimeout(()=>document.getElementById('adm-pw').focus(),100);}
function closeModal(){document.getElementById('modal').style.display='none';}
document.getElementById('adm-pw').addEventListener('keydown',e=>{if(e.key==='Enter')checkPw();});
function checkPw(){
  if(document.getElementById('adm-pw').value===ADMIN_PW){closeModal();loadAdmin();}
  else document.getElementById('pw-err').textContent='비밀번호가 올바르지 않습니다.';
}

async function loadAdmin(){
  show('admin');
  const listEl=document.getElementById('adm-list');
  const statsEl=document.getElementById('adm-stats');
  listEl.innerHTML='<div class="empty"><span class="spinner"></span>불러오는 중...</div>';
  try{
    const r=await fetch(FIREBASE_URL+'/results.json');
    const data=await r.json();
    if(!data){listEl.innerHTML='<div class="empty">아직 응시한 학생이 없습니다.</div>';statsEl.innerHTML='';return;}
    const results=Object.values(data).filter(r=>r&&r.name&&r.score!==undefined&&r.testId==='vocab_1').sort((a,b)=>b.score-a.score);
    if(!results.length){listEl.innerHTML='<div class="empty">아직 응시한 학생이 없습니다.</div>';statsEl.innerHTML='';return;}
    const avg=(results.reduce((s,r)=>s+(Number(r.score)||0),0)/results.length).toFixed(1);
    statsEl.innerHTML=`<div class="stat"><div class="stat-n">${results.length}</div><div class="stat-l">응시 인원</div></div>
      <div class="stat"><div class="stat-n">${avg}</div><div class="stat-l">평균</div></div>
      <div class="stat"><div class="stat-n">${results[0].score}</div><div class="stat-l">최고점</div></div>
      <div class="stat"><div class="stat-n blue">${results[results.length-1].score}</div><div class="stat-l">최저점</div></div>`;
    listEl.innerHTML='';
    results.forEach((r,i)=>{
      const gc=r.pct>=90?'s':r.pct>=80?'a':r.pct>=60?'b':'c';
      const gl=r.pct>=90?'S':r.pct>=80?'A':r.pct>=60?'B':'C';
      const row=document.createElement('div');row.className='admin-row';
      row.innerHTML=`<div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:12px;color:#9ca3af;min-width:20px">${i+1}</span>
        <div><div class="a-name">${r.name}</div><div class="a-date">${r.date||''}</div></div></div>
        <div style="display:flex;align-items:center"><span class="a-score">${r.score}점</span><span class="rank r${gc}">${gl}</span></div>`;
      listEl.appendChild(row);
    });
  }catch(e){listEl.innerHTML='<div class="empty">데이터 불러오기 실패</div>';}
}

async function confirmClear(){
  if(!confirm('단어테스트 기록을 삭제하시겠습니까?'))return;
  const r=await fetch(FIREBASE_URL+'/results.json');
  const data=await r.json();
  if(!data)return;
  for(const[k,v]of Object.entries(data)){
    if(v&&v.testId==='vocab_1')await fetch(FIREBASE_URL+'/results/'+k+'.json',{method:'DELETE'});
  }
  loadAdmin();
}

// TERRYS_BRIDGE — 테리스 학생 사이트(iframe) 연동
// URL ?student=NAME (& 선택: &sid=ID) 가 있을 때만 작동
// 파라미터 없이 직접 접속 시엔 기존 동작 그대로
// ═══════════════════════════════════════════════════════════════════
(function(){
    var params = new URLSearchParams(location.search);
    var urlStudent = params.get('student');
    if(!urlStudent) return;
    var urlSid = params.get('sid') || '';

    function fillName(){
        var ni = document.getElementById('name-in');
        if(ni){
            ni.value = urlStudent;
            ni.style.display = 'none';
            var lbl = document.querySelector('label[for="name-in"]');
            if(!lbl && ni.previousElementSibling && ni.previousElementSibling.tagName === 'LABEL') lbl = ni.previousElementSibling;
            if(lbl) lbl.style.display = 'none';
        }
    }
    function hideAdminBtn(){
        var btns = document.querySelectorAll('button');
        for(var i=0;i<btns.length;i++){
            var t = btns[i].textContent || '';
            if(t.indexOf('관리자 로그인') !== -1) btns[i].style.display = 'none';
        }
    }
    function ready(fn){
        if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
        else fn();
    }
    ready(fillName); ready(hideAdminBtn);
    // 안전망: openChapter / goHome 등이 name-in을 비워도 즉시 다시 채움
    setInterval(function(){
        var ni = document.getElementById('name-in');
        if(ni && ni.value !== urlStudent) ni.value = urlStudent;
    }, 250);

    // Firebase POST 가로채기 → 부모창에 결과 전달
    var FB_HOST = 'terrys-d643a-default-rtdb.firebaseio.com';
    var origFetch = window.fetch.bind(window);
    window.fetch = function(url, opts){
        try{
            if(typeof url === 'string' && url.indexOf(FB_HOST) !== -1
               && opts && opts.method === 'POST' && opts.body){
                var payload = JSON.parse(opts.body);
                if(window.parent && window.parent !== window){
                    var msg = {
                        type:'TERRYS_QUIZ_RESULT',
                        studentId: urlSid,
                        studentName: urlStudent,
                        testFile: (location.pathname.split('/').pop() || ''),
                        payload: payload,
                        Q:null, mcAns:null, saAns:null, ans:null,
                        MC_COUNT:null, curCh:null, chapterTitle:null,
                        selectedChs:null, selectedRounds:null
                    };
                    try{ if(window.Q) msg.Q = JSON.parse(JSON.stringify(window.Q)); }catch(e){}
                    try{ if(window.mcAns) msg.mcAns = [].slice.call(window.mcAns); }catch(e){}
                    try{ if(window.saAns) msg.saAns = [].slice.call(window.saAns); }catch(e){}
                    try{ if(window.ans) msg.ans = [].slice.call(window.ans); }catch(e){}
                    try{ if(typeof window.MC_COUNT === 'number') msg.MC_COUNT = window.MC_COUNT; }catch(e){}
                    try{ if(typeof window.curCh !== 'undefined') msg.curCh = window.curCh; }catch(e){}
                    try{ if(window.CHAPTERS && typeof window.curCh !== 'undefined' && window.CHAPTERS[window.curCh]) msg.chapterTitle = window.CHAPTERS[window.curCh].title; }catch(e){}
                    try{ if(window.selectedChs) msg.selectedChs = [].slice.call(window.selectedChs); }catch(e){}
                    try{ if(window.selectedRounds) msg.selectedRounds = [].slice.call(window.selectedRounds); }catch(e){}
                    window.parent.postMessage(msg, '*');
                }
            }
        }catch(e){}
        return origFetch(url, opts);
    };
})();
