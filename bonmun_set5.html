<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>테리스 영어 · 본문N제</title>
<style>
  :root{ --orange:#d97706; --orange-d:#b45309; --orange-l:#fef3e2; --ink:#1f2937; --mut:#6b7280; --line:#e5e7eb; --ok:#059669; --no:#dc2626; --bg:#fafaf9; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px 80px}
  header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:2px solid var(--orange);padding:12px 14px;display:flex;align-items:center;gap:10px}
  header .logo{font-weight:800;color:var(--orange);font-size:16px;letter-spacing:-.3px;white-space:nowrap}
  header .sub{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  header .gear{margin-left:auto;background:none;border:none;font-size:18px;cursor:pointer;color:var(--mut);padding:4px}
  /* progress dots */
  .dots{display:flex;flex-wrap:wrap;gap:5px;padding:12px 0 4px}
  .dot{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--mut);cursor:pointer}
  .dot.done{background:var(--orange-l);border-color:var(--orange);color:var(--orange-d);font-weight:700}
  .dot.cur{outline:2px solid var(--orange)}
  /* card */
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin:14px 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .qhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .qnum{background:var(--orange);color:#fff;font-weight:800;font-size:13px;border-radius:8px;padding:3px 9px}
  .badge{font-size:11px;background:var(--orange-l);color:var(--orange-d);border-radius:6px;padding:2px 8px;font-weight:600}
  .gr{font-size:11px;background:#eef2ff;color:#4338ca;border-radius:6px;padding:2px 8px;font-weight:700}
  .pts{font-size:11px;color:var(--mut);margin-left:auto}
  .passage{background:#fafaf9;border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:8px;padding:12px 14px;margin:8px 0 14px;font-size:14.5px;color:#374151;white-space:normal}
  .passage u{text-decoration:underline;text-underline-offset:2px}
  .qtext{font-weight:600;margin:6px 0 12px;font-size:15.5px}
  .opt{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0;cursor:pointer;transition:.12s;font-size:15px}
  .opt:hover{border-color:var(--orange)}
  .opt.sel{border-color:var(--orange);background:var(--orange-l)}
  .opt .mk{font-weight:800;color:var(--orange-d);flex:0 0 auto}
  .opt.correct{border-color:var(--ok);background:#ecfdf5}
  .opt.correct .mk{color:var(--ok)}
  .opt.wrong{border-color:var(--no);background:#fef2f2}
  .opt.wrong .mk{color:var(--no)}
  textarea.sa{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:15px;font-family:inherit;min-height:54px;resize:vertical}
  textarea.sa:focus{outline:none;border-color:var(--orange)}
  .expl{display:none;margin-top:12px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px 14px;font-size:14px;color:#92400e;white-space:normal}
  .expl.show{display:block}
  .expl .ans{font-weight:800;color:var(--ok);margin-bottom:6px}
  /* nav buttons */
  .navbtns{display:flex;gap:10px;margin-top:14px}
  .btn{flex:1;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
  .btn.prim{background:var(--orange);color:#fff}
  .btn.prim:active{background:var(--orange-d)}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .submit{width:100%;background:var(--orange);color:#fff;border:none;border-radius:14px;padding:17px;font-size:17px;font-weight:800;cursor:pointer;margin-top:8px}
  /* login gate */
  .gate{max-width:380px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 22px;text-align:center}
  .gate h2{color:var(--orange);margin:0 0 6px}
  .gate p{color:var(--mut);font-size:14px;margin:0 0 18px}
  .gate input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:13px;font-size:16px;margin-bottom:10px;font-family:inherit}
  .gate input:focus{outline:none;border-color:var(--orange)}
  /* result */
  .scorebox{text-align:center;background:#fff;border:2px solid var(--orange);border-radius:16px;padding:26px;margin:14px 0}
  .scorebox .big{font-size:46px;font-weight:900;color:var(--orange)}
  .scorebox .lab{color:var(--mut);font-size:14px}
  /* admin modal */
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-start;justify-content:center;overflow:auto;padding:20px}
  .modal.show{display:flex}
  .modal .box{background:#fff;border-radius:14px;max-width:680px;width:100%;padding:20px}
  .modal h3{margin:0 0 12px;color:var(--orange)}
  .admtbl{width:100%;border-collapse:collapse;font-size:13px}
  .admtbl th,.admtbl td{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
  .admtbl input,.admtbl textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:4px;font-family:inherit;font-size:12px}
  .small{font-size:13px;color:var(--mut)}
  .hide{display:none!important}
</style>
</head>
<body>
<div id="app"></div>

<!-- 데이터 파일은 이 주석 아래 인라인으로 삽입됨 (각 세트마다 다름) -->
<script>// 본문N제 5세트 (201~225) — 동아(윤정미) 3.What a Great Idea — PDF 원문 그대로 전사
window.QUIZ_DATA = {
  SET_TITLE: "본문N제 5세트",
  SET_SUB: "What a Great Idea · 동아(윤정미) Lesson 3 · 201~225번",
  DB: "/results_reading_donga_yjm_l3_bonmun5.json",
  Q: [
    { n:201, type:"mc", p:"답할 수 없는 질문", pts:4,
      passage:`One day, Graham saw some window painters. When they made a mistake, they corrected it by simply painting over it. The next day, she made her own white paint and used it to correct her typing mistakes. Surprisingly, nobody noticed! Soon, everybody at the bank began using it.`,
      q:"다음 글을 읽고 답할 수 없는 질문은?",
      c:["Who gave Graham the idea for Whiteout?","What did the window painters do to fix mistakes?","How much money did Graham make from her invention?","Did other people at the bank use Graham's white paint?","Did people easily see Graham's typing mistakes after she used the paint?"],
      a:2,
      expl:"본문에는 그레이엄의 발명품이 널리 쓰였다는 내용은 있지만, 그로 인해 얼마나 많은 돈을 벌었는지는 나와 있지 않다. ① 누가 그레이엄에게 화이트에 대한 아이디어를 주었는가? ② 창문 도색공들은 실수를 고치기 위해 무엇을 했는가? ③ 그레이엄은 그녀의 발명으로 돈을 얼마나 벌었는가? ④ 은행의 다른 사람들도 그레이엄의 흰색 페인트를 사용했는가? ⑤ 그레이엄이 페인트를 사용한 후 사람들이 그레이엄의 타이핑 실수를 쉽게 보았는가?" },

    { n:202, type:"mc", p:"밑줄 의미", pts:4,
      passage:`One day, Graham saw some window painters. When they made a mistake, they corrected it by simply <u>painting over it</u>. The next day, she made her own white paint and used it to correct her typing mistakes. Surprisingly, nobody noticed! Soon, everybody at the bank began using it.`,
      q:"다음 글의 흐름상 밑줄 친 painting over it이 의미하는 바로 가장 적절한 것은?",
      c:["Making a new window","Cleaning the paint from windows","Finding mistakes in other people's work","Drawing a picture on the bank's window","Painting over a mistake to hide it"],
      a:4,
      expl:"도색공들이 페인트 작업을 하다가 실수를 하면 그 위에 다시 페인트를 덧칠해 가리는 방식을 의미한다. 따라서 ⑤ '실수를 숨기기 위해 그 위에 색을 칠하는 것'이 가장 적절한 설명이다. ① 새로운 창문 만들기 ② 창문에서 페인트를 닦아내기 ③ 다른 사람의 작업에서 실수를 찾기 ④ 은행 창문에 그림 그리기." },

    { n:203, type:"mc", t:"GR", p:"어법 오류", pts:4,
      passage:`One day, Graham saw some window painters. When they made a mistake, they corrected ⓐ <u>it</u> by simply ⓑ <u>painting</u> over it. The next day, she made ⓒ <u>her own</u> white paint and used ⓓ <u>it</u> to correct her typing ⓔ <u>mistaken</u>. Surprisingly, nobody noticed! Soon, everybody at the bank began using it.`,
      q:"다음 글의 밑줄 친 ⓐ~ⓔ 중 어법상 적절하지 않은 것은?",
      c:["ⓐ","ⓑ","ⓒ","ⓓ","ⓔ"],
      a:4,
      expl:"ⓔ는 명사 자리이므로 형용사인 mistaken을 복수 명사형인 mistakes로 고쳐야 한다. ⓐ a mistake를 대신하는 대명사 it ⓑ'~함으로써'의 의미를 가진 표현 'by~ing' ⓒ'자기 자신의' 의미를 가진 '소유격+own+명사' ⓓ white paint를 대신하는 대명사 it" },

    { n:204, type:"mc", p:"이어질 내용", pts:4,
      passage:`Karl von Drais's bicycle had two wooden wheels but no pedals. How did it move without pedals? Well, riders simply pushed the bicycle forward with their feet. The present-day bicycle is the result of many inventors' work in the 19th century.`,
      q:"다음 글 뒤에 올 내용으로 가장 적절한 것은?",
      c:["The biography of Karl von Drais from his birth to his death.","A comparison between 19th century bicycles and 21st century cars.","Examples of how later inventors added pedals and other new parts.","The reason why wooden wheels are better than metal wheels for bikes.","How the volcano ash in 1815 affected the price of wood in Germany."],
      a:2,
      expl:"마지막 문장에서 \"오늘날의 자전거는 많은 발명가의 노력의 결과이다\"라고 했으므로, 후대 발명가들이 어떤 부품을 추가하며 발전시켰는지에 대한 구체적인 예시가 이어지는 것이 적절하다. ① 칼 폰 드라이스의 탄생부터 죽음까지의 전기. ② 19세기 자전거와 21세기 자동차의 비교. ④ 왜 나무 바퀴가 자전거에 금속 바퀴보다 더 나은지에 대한 이유. ⑤ 1815년의 화산재가 독일의 나무 가격에 어떤 영향을 미쳤는지." },

    { n:205, type:"mc", p:"문맥상 부적절 어휘", pts:4,
      passage:`Whiteout was invented by Bette Graham. In 1956, Graham was working at a bank in Texas, USA. At that time, people had to retype the ⓐ <u>whole</u> page when they made even a small mistake. Graham was a ⓑ <u>great</u> typist, so she needed a solution.<br>One day, Graham saw some window painters. When they made a mistake, they ⓒ <u>corrected</u> it by simply painting over it. The next day, she made her own white paint and used it to correct her typing mistakes. Surprisingly, ⓓ <u>everyone</u> noticed! Soon, everybody at the bank ⓔ <u>began</u> using it.`,
      q:"다음 글의 밑줄 친 ⓐ~ⓔ 중, 문맥상 쓰임이 적절하지 않은 것들로 짝지어진 것은?",
      c:["ⓐ, ⓑ","ⓑ, ⓓ","ⓒ, ⓓ","ⓒ, ⓔ","ⓓ, ⓔ"],
      a:1,
      expl:"그레이엄은 타자 실력이 좋지 않았으므로 ⓑ '훌륭한'(great)을 '서툰'(bad)으로 고쳐야 한다. 또한 직접 만든 페인트는 아무도 알아차리지 못했으므로 ⓓ '모두가'(everyone)를 '아무도 ~않다'(nobody)로 고쳐야 한다. ⓐ 전체의 ⓒ 고쳤다 ⓔ 시작했다" },

    { n:206, type:"mc", p:"발명 과정 설명", pts:4,
      passage:`Whiteout was invented by Bette Graham. In 1956, Graham was working at a bank in Texas, USA. At that time, people had to retype the whole page when they made even a small mistake. Graham was a bad typist, so she needed a solution.<br>One day, Graham saw some window painters. When they made a mistake, they corrected it by simply painting over it. The next day, she made her own white paint and used it to correct her typing mistakes. Surprisingly, nobody noticed! Soon, everybody at the bank began using it.`,
      q:"다음 글의 내용으로 보아 Bette Graham의 발명 과정에 대한 설명으로 가장 적절한 것은?",
      c:["She developed a new typing machine that could fix mistakes by itself.","She used a method from a different field to solve her problem.","She asked for help from window painters to create the first whiteout.","She failed many times before she finally made a perfect white paint.","She shared her idea with her bank boss and asked if she could use it."],
      a:1,
      expl:"그레이엄은 도색공들이 실수를 덮는 방식(다른 분야의 방식)을 자신의 타자 문제(자신의 분야)를 해결하기 위해 사용했으므로 ②가 가장 적절하다. ① 그녀는 스스로 실수를 고치는 새로운 타자기를 개발했다. ③ 그녀는 최초의 화이트를 만들기 위해 창문 도색공들에게 도움을 요청했다. ④ 그녀는 완벽한 흰색 페인트를 만들기 전에 여러 번 실패했다. ⑤ 그녀는 자신의 아이디어를 은행 상사와 공유하고, 그것을 사용해도 되는지 물어보았다." },

    { n:207, type:"mc", p:"문맥상 부적절 어휘", pts:4,
      passage:`G: What's your ⓐ <u>favorite</u> pizza place, Tim?<br>B: Little Italy. I think they have the ⓑ <u>worst</u> pizza in Seoul.<br>G: Are you sure? You said the ⓒ <u>different</u> thing about Joe's Pizza last week. Remember?<br>B: Did I? Well, then, I'm not ⓓ <u>sure</u>. Let's just say that they both have ⓔ <u>great</u> pizza.`,
      q:"다음 대화의 밑줄 친 ⓐ~ⓔ 중, 문맥상 쓰임이 적절하지 않은 것들로 짝지어진 것은?",
      c:["ⓐ, ⓑ","ⓑ, ⓒ","ⓒ, ⓓ","ⓓ, ⓔ","ⓑ, ⓔ"],
      a:1,
      expl:"팀은 가장 맛있는 피자라고 생각하는 곳을 말하고 있으므로 ⓑ '최악의'(worst)를 '최고의'(best)로 고쳐야 한다. 또한 여학생은 팀이 지난번에도 같은 말을 했음을 지적하고 있으므로 ⓒ '다른'(different)을 '같은'(same)으로 고쳐야 한다. ⓐ 가장 좋아하는 ⓓ 확신하는 ⓔ 훌륭한" },

    { n:208, type:"mc", p:"문장 삽입", pts:4,
      passage:`(주어진 문장) However, there was just one coffee machine in the building.<br><br>The first webcam was invented to watch a coffee pot. In 1991, Dr. Quentin Stafford-Fraser and Dr. Paul Jardetzky were working at a computer lab in England. To work better, they needed lots of coffee. ( ① ) So, they had to make many disappointing trips to the empty coffee pot. ( ② ) As a solution, the two researchers set up a camera in front of the coffee machine. ( ③ ) The camera took pictures of the coffee pot three times a minute. ( ④ ) With special software, all the researchers in the building could see the pictures on their local network. ( ⑤ )`,
      q:"글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?",
      c:["①","②","③","④","⑤"],
      a:0,
      expl:"주어진 문장은 커피가 많이 필요하다는 상황에 \"그러나(However)\"를 통해 상반되는 제약 조건(커피 머신이 한 대뿐임)을 제시한다. 또한 뒤에 이어지는 헛걸음(So, they had to...)의 원인이 되므로 ①이 적절하다." },

    { n:209, type:"mc", t:"GR", p:"어법 오류 수정", pts:4,
      passage:`Karl von Drais invented the first bicycle in Germany in 1817. Drais's bicycle ①<u>had</u> two wooden wheels but no pedals. How did it ②<u>move</u> without pedals? Well, riders ③<u>simply pushed</u> the bicycle forward with their feet. The present-day bicycle ④<u>is the result</u> of many ⑤<u>inventors work</u> in the 19th century.`,
      q:"다음 밑줄 친 ①~⑤ 중 어법상 틀린 부분을 찾아 옳게 고친 것은?",
      c:["had → was having","move → moved","simply pushed → were simply pushed","is the result → are the results","inventors work → inventors' work"],
      a:4,
      expl:"'여러 발명가들의 노력(업적)'이라는 소유의 의미를 나타내야 하므로, 복수 명사 inventors 뒤에 아포스트로피를 붙인 ⑤inventors' work로 고쳐야 한다. ①'가지고 있다'의 의미를 가진 have의 과거형 ②일반동사 과거형 의문문 'Did+주어+동사원형~?' ③동사 pushed를 수식하는 부사 simply ④주어가 bicycle 단수이므로 동사 is" },

    { n:210, type:"mc", t:"GR", p:"어법 오류", pts:4,
      passage:`G: What will the weather ⓐ <u>be like</u> tomorrow?<br>B: It's ⓑ <u>going to</u> rain a lot.<br>G: Are you sure? It's ⓒ <u>quite</u> sunny now.<br>B: Yes. Check the weather forecast here. It ⓓ<u>says</u> it's going ⓔ <u>raining</u> on Monday.`,
      q:"다음 글의 밑줄 친 ⓐ~ⓔ 중 어법상 쓰임이 적절하지 않은 것은?",
      c:["ⓐ","ⓑ","ⓒ","ⓓ","ⓔ"],
      a:4,
      expl:"be going to 뒤에는 동사원형이 와야 하므로 ⓔ raining을 rain으로 고쳐야 한다. ⓐwill과 함께 쓰여 내일의 날씨가 어떨 것 같은지 묻는 표현이다 ⓑbe going to+동사원형 ⓒ형용사 sunny를 수식하는 부사 quite ⓓ주어가 It(단수)이므로 says를 잘 써주었다" },

    { n:211, type:"sa_text", p:"추론 (2개)", pts:4,
      passage:`Mt. Tambora, a volcano in Indonesia, exploded in 1815. The explosion created a huge cloud of ash, so crops failed around the world. As a result, people didn't have enough food to eat. Surprisingly, this made traveling difficult. Why? In those days, people rode horses, but many horses were killed for food.<br>People needed a new way to travel, and Karl von Drais invented the first bicycle in Germany in 1817. Drais's bicycle had two wooden wheels but no pedals. How did it move without pedals? Well, riders simply pushed the bicycle forward with their feet. The present-day bicycle is the result of many inventors' work in the 19th century.`,
      q:"다음 글을 읽고 추론할 수 있는 내용으로 적절한 것은? (2개) — 정답을 ①③ 형태로 입력하세요.",
      type_note:"정답 2개",
      a:"①③",
      accepts:["13","①③","①, ③","1,3","1 3","③①"],

<script>
(function(){
  "use strict";
  var D = window.QUIZ_DATA;
  var FB = "https://terrys-d643a-default-rtdb.firebaseio.com";
  var MARK = ["①","②","③","④","⑤"];
  var app = document.getElementById('app');
  var answers = {};   // n -> selected index (mc) or text (sa)
  var cur = 0;
  var graded = false;
  var student = null;
  var overrides = {}; // n -> {a, expl}

  /* ---------- 로그인 (terrys_embed_student → TERRYS_BRIDGE 폴백) ---------- */
  function getStudent(){
    try{
      var s = sessionStorage.getItem('terrys_embed_student');
      if(s) return s;
      var b = sessionStorage.getItem('TERRYS_BRIDGE');
      if(b){ try{ var o=JSON.parse(b); return o.name||o.student||b; }catch(e){ return b; } }
    }catch(e){}
    return null;
  }

  function loginGate(){
    app.innerHTML =
      '<div class="gate">'+
      '<h2>테리스 영어</h2>'+
      '<p>'+esc(D.SET_TITLE)+' · 학생 이름을 입력하세요</p>'+
      '<input id="nm" placeholder="이름" autocomplete="off">'+
      '<button class="submit" id="go">시작하기</button>'+
      '</div>';
    document.getElementById('go').onclick=function(){
      var v=document.getElementById('nm').value.trim();
      if(!v){ document.getElementById('nm').focus(); return; }
      try{ sessionStorage.setItem('terrys_embed_student', v); }catch(e){}
      student=v; render();
    };
    document.getElementById('nm').addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('go').click(); });
  }

  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  /* ---------- 채점 ---------- */
  function answerOf(q){ var o=overrides[q.n]; return (o&&o.a!=null)?o.a:q.a; }
  function explOf(q){ var o=overrides[q.n]; return (o&&o.expl!=null&&o.expl!=='')?o.expl:q.expl; }

  function norm(s){ return String(s||'').toLowerCase().replace(/[.,!?'"`’]/g,'').replace(/\s+/g,' ').trim(); }
  function saCorrect(q, val){
    var gold=[answerOf(q)].concat(q.accepts||[]);
    var v=norm(val);
    for(var i=0;i<gold.length;i++){ if(norm(gold[i])===v) return true; }
    // 느슨한 포함 매칭(서술형 키워드)
    for(var j=0;j<gold.length;j++){ var g=norm(gold[j]); if(g && v && (v.indexOf(g)>=0||g.indexOf(v)>=0)) return true; }
    return false;
  }
  function isCorrect(q){
    if(q.type==='mc') return answers[q.n]===answerOf(q);
    return saCorrect(q, answers[q.n]||'');
  }

  /* ---------- 렌더 ---------- */
  function shell(inner){
    app.innerHTML =
      '<header><span class="logo">테리스 영어</span>'+
      '<span class="sub">'+esc(D.SET_TITLE)+' · '+esc(D.SET_SUB)+'</span>'+
      '<button class="gear" id="gear" title="관리자">⚙</button></header>'+
      '<div class="wrap">'+inner+'</div>';
    document.getElementById('gear').onclick=adminPrompt;
  }

  function dotsHTML(){
    var h='<div class="dots">';
    D.Q.forEach(function(q,i){
      var c='dot'; if(answers[q.n]!=null && answers[q.n]!=='') c+=' done'; if(i===cur) c+=' cur';
      h+='<div class="'+c+'" data-i="'+i+'">'+q.n+'</div>';
    });
    return h+'</div>';
  }

  function optHTML(q){
    if(q.type==='mc'){
      return q.c.map(function(t,i){
        var cls='opt'; if(answers[q.n]===i) cls+=' sel';
        if(graded){
          if(i===answerOf(q)) cls+=' correct';
          else if(answers[q.n]===i) cls+=' wrong';
        }
        return '<div class="'+cls+'" data-pick="'+i+'"><span class="mk">'+MARK[i]+'</span><span>'+q.c[i]+'</span></div>';
      }).join('');
    }
    // sa_text
    var val=answers[q.n]||'';
    return '<textarea class="sa" data-sa placeholder="여기에 답을 입력하세요"'+(graded?' disabled':'')+'>'+esc(val)+'</textarea>';
  }

  function explHTML(q){
    if(!graded) return '';
    var ok=isCorrect(q);
    var ansText = q.type==='mc' ? (MARK[answerOf(q)]+' '+q.c[answerOf(q)]) : answerOf(q);
    return '<div class="expl show">'+
      '<div class="ans">'+(ok?'✅ 정답':'❌ 오답')+' · 정답: '+esc(ansText)+'</div>'+
      esc(explOf(q))+'</div>';
  }

  function questionView(){
    var q=D.Q[cur];
    var inner=dotsHTML()+
      '<div class="card">'+
      '<div class="qhead"><span class="qnum">'+q.n+'</span>'+
      (q.t==='GR'?'<span class="gr">어법</span>':'')+
      '<span class="badge">'+esc(q.p||'')+'</span>'+
      '<span class="pts">'+q.pts+'점</span></div>'+
      (q.passage?'<div class="passage">'+q.passage+'</div>':'')+
      '<div class="qtext">'+q.q+'</div>'+
      optHTML(q)+
      explHTML(q)+
      '</div>'+
      navHTML();
    shell(inner);
    bindQ();
  }

  function navHTML(){
    var last = cur===D.Q.length-1;
    if(graded){
      return '<div class="navbtns">'+
        '<button class="btn ghost" id="prev"'+(cur===0?' disabled':'')+'>◀ 이전</button>'+
        '<button class="btn '+(last?'ghost':'prim')+'" id="next"'+(last?' disabled':'')+'>다음 ▶</button>'+
        '</div>'+
        '<button class="submit" id="toresult" style="margin-top:10px;background:var(--orange-d)">결과 화면으로</button>';
    }
    if(last){
      return '<div class="navbtns"><button class="btn ghost" id="prev">◀ 이전</button></div>'+
        '<button class="submit" id="submit">제출하고 채점하기</button>';
    }
    return '<div class="navbtns">'+
      '<button class="btn ghost" id="prev"'+(cur===0?' disabled':'')+'>◀ 이전</button>'+
      '<button class="btn prim" id="next">다음 ▶</button></div>';
  }

  function bindQ(){
    var q=D.Q[cur];
    Array.prototype.forEach.call(document.querySelectorAll('.dot'),function(d){
      d.onclick=function(){ cur=+d.getAttribute('data-i'); questionView(); };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-pick]'),function(o){
      if(graded) return;
      o.onclick=function(){ answers[q.n]=+o.getAttribute('data-pick'); questionView(); };
    });
    var sa=document.querySelector('[data-sa]');
    if(sa && !graded){ sa.oninput=function(){ answers[q.n]=sa.value; }; }
    var p=document.getElementById('prev'); if(p) p.onclick=function(){ if(cur>0){cur--;questionView();} };
    var nx=document.getElementById('next'); if(nx) nx.onclick=function(){ if(cur<D.Q.length-1){cur++;questionView();} };
    var sb=document.getElementById('submit'); if(sb) sb.onclick=submit;
    var tr=document.getElementById('toresult'); if(tr) tr.onclick=resultView;
  }

  /* ---------- 제출/결과 ---------- */
  function score(){
    var s=0,right=0;
    D.Q.forEach(function(q){ if(isCorrect(q)){ s+=q.pts; right++; } });
    return {s:s, right:right, total:D.Q.length};
  }

  function submit(){
    var blanks=D.Q.filter(function(q){ return answers[q.n]==null||answers[q.n]===''; });
    if(blanks.length){
      if(!confirm('아직 '+blanks.length+'문항을 풀지 않았어요. 그래도 제출할까요?')) return;
    }
    graded=true;
    var r=score();
    saveScore(r);
    resultView();
  }

  function resultView(){
    var r=score();
    var wrongs=D.Q.filter(function(q){ return !isCorrect(q); });
    var inner=
      '<div class="scorebox"><div class="lab">'+esc(student)+' 님의 점수</div>'+
      '<div class="big">'+r.s+'점</div>'+
      '<div class="lab">정답 '+r.right+' / '+r.total+'문항</div></div>'+
      '<p class="small">아래 번호를 누르면 해당 문제의 해설을 볼 수 있어요. (틀린 문항은 빨강)</p>'+
      '<div class="dots">'+
        D.Q.map(function(q,i){
          var ok=isCorrect(q);
          return '<div class="dot '+(ok?'done':'')+'" data-i="'+i+'" style="'+(ok?'':'background:#fef2f2;border-color:var(--no);color:var(--no);font-weight:700')+'">'+q.n+'</div>';
        }).join('')+
      '</div>'+
      '<button class="submit" id="review" style="margin-top:16px">전체 해설 보기 ('+wrongs.length+'개 틀림)</button>';
    shell(inner);
    Array.prototype.forEach.call(document.querySelectorAll('.dot'),function(d){
      d.onclick=function(){ cur=+d.getAttribute('data-i'); questionView(); };
    });
    document.getElementById('review').onclick=function(){ cur=0; questionView(); };
  }

  /* ---------- Firebase 저장 ---------- */
  function saveScore(r){
    if(!student) return;
    var path=(D.DB||'/results_reading_unknown.json');
    var url=FB+path; // path는 .json 포함
    var wrong=D.Q.filter(function(q){return !isCorrect(q);}).map(function(q){return q.n;});
    var payload={ name:student, score:r.s, right:r.right, total:r.total, wrong:wrong, at:new Date().toISOString() };
    try{
      fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
        .catch(function(){});
    }catch(e){}
  }

  /* ---------- 관리자 패널 ---------- */
  function adminPrompt(){
    var pw=prompt('관리자 비밀번호');
    if(pw==='terry2025'){ adminPanel(); }
    else if(pw!=null){ alert('비밀번호가 틀렸습니다.'); }
  }
  function adminPanel(){
    var rows=D.Q.map(function(q){
      var aVal = q.type==='mc' ? (answerOf(q)+1) : answerOf(q);
      return '<tr><td>'+q.n+'</td>'+
        '<td>'+esc(q.type)+'</td>'+
        '<td><input data-adm-a="'+q.n+'" value="'+esc(aVal)+'"></td>'+
        '<td><textarea data-adm-e="'+q.n+'" rows="2">'+esc(explOf(q))+'</textarea></td></tr>';
    }).join('');
    var box=document.createElement('div');
    box.className='modal show';
    box.innerHTML='<div class="box"><h3>⚙ 관리자 — 정답·해설 수정</h3>'+
      '<p class="small">객관식 정답은 번호(1~5)로, 서술형은 텍스트로 입력하세요. 수정은 이 브라우저에서만 즉시 채점에 반영됩니다.</p>'+
      '<table class="admtbl"><tr><th>번호</th><th>유형</th><th>정답</th><th>해설</th></tr>'+rows+'</table>'+
      '<div class="navbtns"><button class="btn ghost" id="adm-close">닫기</button><button class="btn prim" id="adm-save">저장</button></div></div>';
    document.body.appendChild(box);
    box.querySelector('#adm-close').onclick=function(){ box.remove(); };
    box.querySelector('#adm-save').onclick=function(){
      D.Q.forEach(function(q){
        var ai=box.querySelector('[data-adm-a="'+q.n+'"]').value.trim();
        var ei=box.querySelector('[data-adm-e="'+q.n+'"]').value;
        var o=overrides[q.n]||{};
        if(q.type==='mc'){ var idx=parseInt(ai,10)-1; if(idx>=0&&idx<q.c.length) o.a=idx; }
        else { o.a=ai; }
        o.expl=ei;
        overrides[q.n]=o;
      });
      box.remove();
      if(graded) resultView(); else questionView();
      alert('저장되었습니다.');
    };
  }

  /* ---------- 시작 ---------- */
  function render(){ questionView(); }
  function start(){
    if(!D || !D.Q){ app.innerHTML='<div class="gate"><h2>데이터 없음</h2><p>이 시험의 문항 데이터를 불러오지 못했습니다.</p></div>'; return; }
    student=getStudent();
    if(student) render(); else loginGate();
  }
  start();
})();
</script>
</body>
</html>
