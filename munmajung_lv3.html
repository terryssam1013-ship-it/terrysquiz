<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문마중 Level 3 (2025 개정) — 챕터별 문법 테스트</title>
<style>
:root {
  --orange: #ea580c;
  --orange-light: #ffedd5;
  --orange-dark: #9a3412;
  --red: #a32d2d;
  --red-light: #faece7;
  --blue-light: #e6f1fb;
  --bg: #fff7ed;
  --card: #ffffff;
  --text: #1a1a1a;
  --text-muted: #6b7280;
  --border: rgba(0,0,0,.1);
  --radius: 12px;
  --radius-sm: 8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1rem}
.wrap{max-width:680px;margin:0 auto}
.screen{display:none}
.screen.active{display:block}

.hdr{background:var(--orange);color:#fff;border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:1rem}
.hdr-sub{font-size:13px;opacity:.85;margin-bottom:4px}
.hdr-title{font-size:21px;font-weight:700}
.hdr-row{display:flex;align-items:center;justify-content:space-between}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:.75rem}

label{font-size:14px;font-weight:500;display:block;margin-bottom:6px}
input[type=text],input[type=password]{width:100%;padding:11px 14px;font-size:15px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--text);margin-bottom:14px}
input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(234,88,12,.12)}

.btn{display:block;width:100%;padding:12px;font-size:15px;font-weight:600;border-radius:var(--radius-sm);border:none;cursor:pointer;transition:all .15s;text-align:center}
.btn-orange{background:var(--orange);color:#fff}
.btn-orange:hover{background:var(--orange-dark)}
.btn-outline{background:#fff;color:var(--text-muted);border:1px solid var(--border);margin-top:8px;font-weight:500}
.btn-outline:hover{background:#f9f9f9}
.btn-sm{padding:7px 14px;font-size:13px;width:auto;display:inline-block;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;cursor:pointer}

/* Chapter Grid */
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:1rem}
.ch-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:1rem;cursor:pointer;transition:all .15s;text-align:center;text-decoration:none;color:var(--text)}
.ch-card:hover{border-color:var(--orange);background:var(--orange-light);transform:translateY(-2px);box-shadow:0 4px 12px rgba(234,88,12,.15)}
.ch-card:active{transform:scale(.98)}
.ch-num{font-size:24px;font-weight:700;color:var(--orange);line-height:1;margin-bottom:6px}
.ch-name{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:4px}
.ch-sub{font-size:11px;color:var(--text-muted);line-height:1.3}

.prog-wrap{margin-bottom:1.25rem}
.prog-bar{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin:5px 0 3px}
.prog-fill{height:100%;background:var(--orange);border-radius:3px;transition:width .3s}
.prog-info{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted)}

.q-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:10px;letter-spacing:.03em}
.badge-a{background:#ffedd5;color:#9a3412}
.badge-b{background:#dbeafe;color:#1d4ed8}
.badge-c{background:#fef3c7;color:#92400e}
.q-point{font-size:11px;color:var(--text-muted);margin-bottom:8px}
.q-text{font-size:15px;line-height:1.75;margin-bottom:1.25rem}
.blank{display:inline-block;border-bottom:2.5px solid var(--orange);min-width:72px;text-align:center;color:var(--orange);font-weight:600;padding:0 4px}
.uline{text-decoration:underline;text-decoration-color:#dc2626;text-underline-offset:3px;font-weight:600;color:#991b1b}

.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:1.25rem}
.choice{text-align:left;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--text);cursor:pointer;font-size:14px;line-height:1.6;transition:all .15s}
.choice:hover{border-color:var(--orange);background:var(--orange-light)}
.choice.sel{border-color:var(--orange);background:var(--orange-light);color:var(--orange-dark);font-weight:600}

.nav{display:flex;gap:8px}
.nav-btn{flex:1;padding:11px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:#f9fafb;color:var(--text-muted);transition:all .15s}
.nav-btn.primary{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:600}
.nav-btn:hover:not(:disabled){opacity:.85}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}

.score-wrap{text-align:center;padding:1.5rem 0 1rem}
.score-ring{width:130px;height:130px;border-radius:50%;background:var(--orange);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 1rem;color:#fff}
.score-num{font-size:40px;font-weight:700;line-height:1}
.score-total{font-size:14px;opacity:.85;margin-top:2px}
.score-grade{font-size:22px;font-weight:700;color:var(--orange);margin-bottom:4px}
.score-msg{font-size:13px;color:var(--text-muted)}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:.75rem 0}
.stat{background:#fff7ed;border-radius:var(--radius-sm);padding:.75rem;text-align:center;border:1px solid var(--border)}
.stat-n{font-size:24px;font-weight:700;color:var(--orange)}
.stat-n.red{color:var(--red)}
.stat-l{font-size:11px;color:var(--text-muted);margin-top:2px}

.toggle-btn { cursor: pointer; transition: all .2s; }
.toggle-btn:hover { background: #f3f4f6 !important; }
.click-hint { font-size: 11px; color: #9ca3af; font-weight: normal; margin-left: 6px; }
.detail-box { display: none; background: #fff; padding: 14px; margin-top: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); cursor: default; }
.detail-box.active { display: block; animation: fadeIn 0.2s ease-in-out; }
.detail-q { font-size: 14px; line-height: 1.6; margin-bottom: 12px; color: var(--text); }
.detail-c { font-size: 13px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 6px; background: #f9fafb; color: var(--text-muted); }
.detail-c.is-ans { border-color: #16a34a; background: #f0fdf4; color: #166534; font-weight: 600; }
.detail-c.is-wrong { border-color: #fca5a5; background: #fef2f2; color: #991b1b; text-decoration: line-through; opacity: 0.8; }
.detail-exp { margin-top: 12px; padding: 12px 14px; background: #fffbeb; border: 1px solid #fcd34d; border-radius: 8px; font-size: 13px; line-height: 1.6; color: #78350f; }
.detail-exp-label { font-size: 11px; font-weight: 700; color: #92400e; margin-bottom: 4px; letter-spacing: .03em; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

.review-item{display:flex;gap:10px;padding:12px;border-radius:var(--radius-sm);border:1px solid transparent;margin-bottom:6px;font-size:13px;line-height:1.5;align-items:flex-start}
.review-item.ok{background:#f0fdf4;border-color:#bbf7d0}
.review-item.ng{background:#fef2f2;border-color:#fecaca}
.review-icon{font-size:15px;margin-top:1px;flex-shrink:0}
.review-body{flex:1}
.review-wrong{font-size:12px;color:var(--red);margin-top:3px}

.admin-row-wrap{border-bottom:1px solid var(--border);padding:11px 0}
.admin-row-wrap:last-child{border-bottom:none}
.admin-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;cursor:pointer}
.admin-row:hover .admin-name{color:var(--orange)}
.admin-details{display:none;background:#fff7ed;padding:14px;border-radius:var(--radius-sm);margin-top:10px;border:1px solid var(--border)}
.admin-details.active{display:block}
.admin-wrong-item{display:flex;gap:10px;font-size:13px;border-bottom:1px dashed #e5e7eb;padding:12px 8px;margin-bottom:0;transition:background .2s;border-radius:6px}
.admin-wrong-item:last-child{border-bottom:none}
.admin-wrong-point{font-weight:600;color:var(--text);flex-shrink:0;min-width:35px}
.admin-wrong-desc{flex:1;line-height:1.5}
.admin-wrong-ans{color:var(--red);font-weight:600}
.admin-correct-ans{color:var(--orange);font-weight:600}
.admin-rank{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.rank-s{background:#ffedd5;color:#9a3412}
.rank-a{background:#dbeafe;color:#1d4ed8}
.rank-b{background:#fef3c7;color:#92400e}
.rank-c{background:#fee2e2;color:#991b1b}
.admin-name{font-weight:500;transition:color .2s}
.admin-date{font-size:11px;color:var(--text-muted);margin-top:2px}
.admin-score{font-weight:700;color:var(--orange);font-size:15px;margin-right:8px}
.section-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:1.25rem 0 .5rem;padding-bottom:4px;border-bottom:1px solid var(--border)}
.empty{text-align:center;padding:2rem;color:var(--text-muted);font-size:14px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:999;padding:1rem}
.modal-box{background:#fff;border-radius:var(--radius);padding:1.5rem;width:100%;max-width:340px;border:1px solid var(--border)}
.modal-box h3{font-size:16px;font-weight:700;margin-bottom:1rem}
.modal-btns{display:flex;gap:8px;margin-top:1rem}
.modal-btns button{flex:1;padding:10px;border-radius:var(--radius-sm);font-size:14px;cursor:pointer;border:1px solid var(--border);background:#f9fafb;color:var(--text)}
.modal-btns button.ok{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:600}
.err-msg{font-size:12px;color:var(--red);margin-top:4px;min-height:16px}

.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(234,88,12,.2);border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

.ch-select{padding:8px 12px;font-size:14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--text);margin-bottom:1rem;cursor:pointer;width:100%}
.ch-select:focus{outline:none;border-color:var(--orange)}
</style>
</head>
<body>
<div class="wrap">

<!-- ── LANDING (챕터 선택) ───── -->
<div id="s-landing" class="screen active">
  <div class="hdr">
    <div class="hdr-sub">문마중 Level 3 (2025 개정)</div>
    <div class="hdr-title">챕터별 문법 테스트</div>
  </div>
  <div class="card">
    <label for="name-in">이름</label>
    <input type="text" id="name-in" placeholder="예) 홍길동" autocomplete="off">
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:.5rem">아래에서 응시할 챕터를 선택하세요 · 각 25문항 · 100점</p>
    <div class="ch-grid" id="ch-grid"></div>
    <button class="btn btn-outline" onclick="openAdminModal()">관리자 로그인</button>
  </div>
</div>

<!-- ── QUIZ ───── -->
<div id="s-quiz" class="screen">
  <div class="hdr hdr-row">
    <div>
      <div class="hdr-sub" id="qz-name"></div>
      <div class="hdr-title" id="qz-title" style="font-size:16px"></div>
    </div>
    <span id="qz-counter" style="font-size:13px;opacity:.8"></span>
  </div>
  <div class="card">
    <div class="prog-wrap">
      <div class="prog-info"><span id="prog-txt"></span><span id="prog-pct"></span></div>
      <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
    <span id="q-badge" class="q-badge badge-a"></span>
    <div class="q-point" id="q-point"></div>
    <div class="q-text" id="q-text"></div>
    <div class="choices" id="q-choices"></div>
    <div class="nav">
      <button class="nav-btn" id="btn-prev" onclick="nav(-1)">← 이전</button>
      <button class="nav-btn primary" id="btn-next" onclick="navNext()">다음 →</button>
    </div>
  </div>
</div>

<!-- ── RESULT ───── -->
<div id="s-result" class="screen">
  <div class="hdr">
    <div class="hdr-sub" id="res-chapter"></div>
    <div class="hdr-title" id="res-name"></div>
  </div>
  <div class="card">
    <div class="score-wrap">
      <div class="score-ring"><span class="score-num" id="res-score"></span><span class="score-total">/ 100</span></div>
      <div class="score-grade" id="res-grade"></div>
      <div class="score-msg" id="res-msg"></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-n" id="st-ok"></div><div class="stat-l">정답</div></div>
      <div class="stat"><div class="stat-n red" id="st-ng"></div><div class="stat-l">오답</div></div>
      <div class="stat"><div class="stat-n" id="st-pct"></div><div class="stat-l">정답률</div></div>
    </div>
    <div id="save-status" style="font-size:12px;color:var(--text-muted);text-align:center;margin:.5rem 0"></div>
    <div class="section-lbl">문항별 결과 (문항을 클릭하면 지문과 정답이 보입니다)</div>
    <div id="review"></div>
    <button class="btn btn-outline" style="margin-top:1rem" onclick="goHome()">← 처음으로</button>
  </div>
</div>

<!-- ── ADMIN ───── -->
<div id="s-admin" class="screen">
  <div class="hdr hdr-row">
    <div><div class="hdr-sub">관리자 패널</div><div class="hdr-title">학생 성적 현황</div></div>
    <button class="btn-sm" onclick="confirmClear()">현재 챕터 초기화</button>
  </div>
  <div class="card">
    <label>챕터 선택</label>
    <select id="adm-ch" class="ch-select" onchange="loadAdmin()"></select>
    <div class="stats" id="adm-stats"></div>
    <div class="section-lbl">응시 학생 목록 (이름 클릭 → 오답 문항 클릭)</div>
    <div id="adm-list"></div>
    <button class="btn btn-outline" style="margin-top:1rem" onclick="goHome()">← 나가기</button>
  </div>
</div>

</div><!-- /wrap -->

<div id="modal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <h3>관리자 비밀번호</h3>
    <input type="password" id="adm-pw" placeholder="비밀번호 입력"
      style="width:100%;padding:10px 14px;font-size:15px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text)">
    <div class="err-msg" id="pw-err"></div>
    <div class="modal-btns">
      <button onclick="closeModal()">취소</button>
      <button class="ok" onclick="checkPw()">로그인</button>
    </div>
  </div>
</div>

<script>
const FIREBASE_URL = "https://terrys-d643a-default-rtdb.firebaseio.com";
const ADMIN_PW = "terry2025";

// ════════ CHAPTERS DATA ════════
const CHAPTERS = {
1:{title:"Chapter 01 — 기초 문법",sub:"문장 성분 · 8품사 · 문장의 형식",db:"/results_mun_lv3_ch01.json",q:[
{t:"B",p:"문장 성분",q:'다음 문장의 <strong>주어</strong>를 고르시오.<br><br>The students in our class are very smart.',c:["① The","② students","③ The students","④ The students in our class","⑤ are"],a:3,e:"전체 주어는 'The students in our class'. in our class는 명사구 수식."},
{t:"B",p:"문장 성분",q:'다음 문장의 <strong>목적어</strong>를 고르시오.<br><br>My mother bought me a new bag yesterday.',c:["① mother","② me","③ a new bag","④ me a new bag","⑤ yesterday"],a:2,e:"동사는 bought, 직접목적어는 a new bag. me는 간접목적어."},
{t:"B",p:"문장 성분",q:'다음 문장의 <strong>보어</strong>를 고르시오.<br><br>The story made the children happy.',c:["① The story","② made","③ the children","④ happy","⑤ the children happy"],a:3,e:"5형식의 목적격 보어는 happy. the children은 목적어."},
{t:"A",p:"8품사",q:'다음 밑줄 친 단어의 품사로 알맞은 것을 고르시오.<br><br>She speaks English <u>fluently</u>.',c:["① 명사","② 동사","③ 형용사","④ 부사","⑤ 전치사"],a:3,e:"fluently는 -ly로 끝나는 부사. 동사 speaks를 수식."},
{t:"A",p:"8품사",q:'다음 밑줄 친 단어의 품사가 <strong>나머지와 다른</strong> 것을 고르시오.',c:["① a <u>beautiful</u> girl","② <u>happy</u> children","③ very <u>kind</u>","④ runs <u>fast</u>","⑤ <u>smart</u> students"],a:3,e:"fast는 부사로도 쓰여 '빨리'(동사 수식). 나머지는 모두 형용사."},
{t:"B",p:"1형식",q:'다음 중 <strong>1형식</strong> 문장을 고르시오.',c:["① She looks tired.","② Birds fly in the sky.","③ I have a book.","④ He gave me a pen.","⑤ They call me Tom."],a:1,e:"Birds fly = 주어+자동사 → 1형식. in the sky는 수식어."},
{t:"B",p:"2형식 · 감각동사",q:'다음 빈칸에 알맞은 것을 고르시오.<br><br>This soup tastes <span class="blank">_____</span>.',c:["① deliciously","② to delicious","③ delicious","④ deliciousness","⑤ being delicious"],a:2,e:"감각동사 taste 뒤에는 형용사 → delicious."},
{t:"B",p:"3형식",q:'다음 중 <strong>3형식</strong> 문장을 고르시오.',c:["① The flowers smell sweet.","② She lives in Seoul.","③ I read a book every day.","④ Mom made me a cake.","⑤ We elected him president."],a:2,e:"I read a book = 주어+동사+목적어 → 3형식. ①은 2형식, ②는 1형식, ④는 4형식, ⑤는 5형식."},
{t:"A",p:"4형식 → 3형식",q:'다음 문장을 3형식으로 바꿀 때 알맞은 것을 고르시오.<br><br>She bought me a doll.',c:["① She bought a doll to me.","② She bought a doll for me.","③ She bought a doll of me.","④ She bought to me a doll.","⑤ She bought for me a doll."],a:1,e:"give + 간목 + 직목 → 4형식 어순. 'me a book'."},
{t:"A",p:"4형식 → 3형식 전치사",q:'다음 중 4형식을 3형식으로 바꿀 때 <strong>of</strong>를 쓰는 동사를 고르시오.',c:["① give","② tell","③ make","④ ask","⑤ send"],a:3,e:"ask는 4→3 변환 시 of: 'asked a question of me'. give/tell/send는 to, make/buy는 for."},
{t:"B",p:"5형식 · 목적격 보어",q:'다음 빈칸에 들어갈 수 <strong>없는</strong> 것을 고르시오.<br><br>I want you <span class="blank">_____</span>.',c:["① happy","② to study","③ a doctor","④ study","⑤ to be quiet"],a:3,e:"want + 목적어 + 보어는 to부정사/형용사/명사. 동사원형(study)은 불가."},

];

let studentName='', curCh=null, ans=[], cur=0, TOTAL=0;

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('s-'+id).classList.add('active');window.scrollTo(0,0)}
function goHome(){document.getElementById('name-in').value='';renderGrid();show('landing')}

// ── 챕터 그리드 렌더링 ──────────────
function renderGrid(){
  const el = document.getElementById('ch-grid');
  el.innerHTML = '';
  Object.keys(CHAPTERS).forEach(k=>{
    const ch = CHAPTERS[k];
    const num = parseInt(k) < 10 ? '0'+k : k;
    const titleParts = ch.title.split('—');
    const name = titleParts.length > 1 ? titleParts[1].trim() : ch.title;
    const d = document.createElement('div');
    d.className = 'ch-card';
    d.innerHTML = `<div class="ch-num">${num}</div><div class="ch-name">${name}</div><div class="ch-sub">${ch.sub||''}</div>`;
    d.onclick = ()=>startQuiz(k);
    el.appendChild(d);
  });
}

// ── 퀴즈 시작 ──────────────
function startQuiz(k){
  studentName = document.getElementById('name-in').value.trim();
  if(!studentName){alert('이름을 입력해주세요.');return;}
  curCh = k;
  ans = new Array(CHAPTERS[k].q.length).fill(-1);
  TOTAL = CHAPTERS[k].q.length;
  cur = 0;
  document.getElementById('qz-name').textContent = studentName;
  document.getElementById('qz-title').textContent = CHAPTERS[k].title;
  render(0);
  show('quiz');
}

function render(i){
  const Q = CHAPTERS[curCh].q;
  const q = Q[i];
  const pct = Math.round(i/TOTAL*100);
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-txt').textContent = (i+1)+' / '+TOTAL;
  document.getElementById('prog-pct').textContent = pct+'%';
  document.getElementById('qz-counter').textContent = (i+1)+'/'+TOTAL;
  const badge = document.getElementById('q-badge');
  badge.textContent = q.t==='A'?'[A형] 빈칸/알맞은 것':q.t==='B'?'[B형] 분석/분류':'[C형] 옳은/틀린 것';
  badge.className = 'q-badge badge-'+q.t.toLowerCase();
  document.getElementById('q-point').textContent = q.p;
  document.getElementById('q-text').innerHTML = q.q;
  const el = document.getElementById('q-choices');
  el.innerHTML = '';
  q.c.forEach((c,ci)=>{
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = c;
    if(ans[i]===ci) b.classList.add('sel');
    b.onclick = ()=>pick(i,ci);
    el.appendChild(b);
  });
  document.getElementById('btn-prev').disabled = i===0;
  document.getElementById('btn-next').textContent = i===TOTAL-1?'제출 →':'다음 →';
}

function pick(qi,ci){
  ans[qi] = ci;
  document.getElementById('q-choices').querySelectorAll('.choice').forEach((b,i)=>{
    b.classList.toggle('sel',i===ci);
  });
}

function nav(d){cur = Math.max(0, Math.min(TOTAL-1, cur+d));render(cur)}

function navNext(){
  if(cur === TOTAL-1){
    const empty = ans.filter(a=>a===-1).length;
    if(empty>0 && !confirm(`${empty}문항을 아직 풀지 않았습니다. 제출하시겠습니까?`)) return;
    submit();
  } else {
    nav(1);
  }
}

async function submit(){
  const Q = CHAPTERS[curCh].q;
  const correct = ans.filter((a,i)=>a===Q[i].a).length;
  const score = Math.round(correct/TOTAL*100);
  const grade = GRADES.find(g=>score>=g.min);

  document.getElementById('res-name').textContent = studentName+'님의 결과';
  document.getElementById('res-chapter').textContent = CHAPTERS[curCh].title;
  document.getElementById('res-score').textContent = score;
  document.getElementById('res-grade').textContent = grade.label;
  document.getElementById('res-msg').textContent = grade.msg;
  document.getElementById('st-ok').textContent = correct;
  document.getElementById('st-ng').textContent = TOTAL-correct;
  document.getElementById('st-pct').textContent = score+'%';

  const rv = document.getElementById('review');
  rv.innerHTML = '';
  Q.forEach((q,i)=>{
    const ok = ans[i]===q.a;
    const stuAns = ans[i];
    const choicesHtml = q.c.map((cText,cIdx)=>{
      let cClass = 'detail-c';
      if(cIdx===q.a) cClass += ' is-ans';
      else if(cIdx===stuAns) cClass += ' is-wrong';
      return `<div class="${cClass}">${cText}</div>`;
    }).join('');
    const d = document.createElement('div');
    d.className = 'review-item toggle-btn '+(ok?'ok':'ng');
    d.setAttribute('onclick',`document.getElementById('rev-det-${i}').classList.toggle('active')`);
    d.innerHTML = `
      <span class="review-icon">${ok?'✓':'✗'}</span>
      <div class="review-body">
        <div style="font-size:14px;margin-bottom:4px;">
          <strong>${i+1}번</strong> ${q.p} <span class="click-hint">(클릭하여 원문/정답 보기 ▾)</span>
        </div>
        ${!ok?`<div class="review-wrong">내 답: ${ans[i]>=0?q.c[ans[i]].split(' ')[0]:'미응답'} → 정답: ${q.c[q.a].split(' ')[0]}</div>`:''}
        <div class="detail-box" id="rev-det-${i}" onclick="event.stopPropagation()">
          <div class="detail-q">${q.q}</div>
          <div style="display:flex;flex-direction:column;gap:4px;">${choicesHtml}</div>
          ${q.e?`<div class="detail-exp"><div class="detail-exp-label">💡 해설</div>${q.e}</div>`:''}
        </div>
      </div>`;
    rv.appendChild(d);
  });

  show('result');

  const statusEl = document.getElementById('save-status');
  statusEl.innerHTML = '<span class="spinner"></span>점수 저장 중...';
  try{
    const payload = {name:studentName, score, total:100, correct, totalQ:TOTAL, pct:score, grade:grade.g, answers:ans, chapter:curCh, date:new Date().toLocaleString('ko-KR'), ts:Date.now()};
    const r = await fetch(FIREBASE_URL+CHAPTERS[curCh].db, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    statusEl.innerHTML = r.ok?'<span style="color:var(--orange)">✓ 점수가 저장되었습니다</span>':'저장 실패';
  }catch(e){
    statusEl.textContent = '저장 실패: '+e.message;
  }
}

// ── 관리자 ──────────────────────────
function openAdminModal(){
  document.getElementById('adm-pw').value = '';
  document.getElementById('pw-err').textContent = '';
  document.getElementById('modal').style.display = 'flex';
  setTimeout(()=>document.getElementById('adm-pw').focus(),100);
}
function closeModal(){document.getElementById('modal').style.display='none'}
document.getElementById('adm-pw').addEventListener('keydown',e=>{if(e.key==='Enter')checkPw()});

function checkPw(){
  if(document.getElementById('adm-pw').value===ADMIN_PW){
    closeModal();
    // 챕터 셀렉트 채우기
    const sel = document.getElementById('adm-ch');
    sel.innerHTML = '';
    Object.keys(CHAPTERS).forEach(k=>{
      const o = document.createElement('option');
      o.value = k;
      o.textContent = CHAPTERS[k].title;
      sel.appendChild(o);
    });
    loadAdmin();
  } else {
    document.getElementById('pw-err').textContent = '비밀번호가 올바르지 않습니다.';
  }
}

async function loadAdmin(){
  show('admin');
  const sel = document.getElementById('adm-ch').value || Object.keys(CHAPTERS)[0];
  const ch = CHAPTERS[sel];
  const Q = ch.q;
  const listEl = document.getElementById('adm-list');
  const statsEl = document.getElementById('adm-stats');
  listEl.innerHTML = '<div class="empty"><span class="spinner"></span>불러오는 중...</div>';

  try{
    const r = await fetch(FIREBASE_URL+ch.db);
    const data = await r.json();
    if(!data){
      listEl.innerHTML = '<div class="empty">아직 응시한 학생이 없습니다.</div>';
      statsEl.innerHTML = '';
      return;
    }
    const raw = Object.values(data);
    const results = raw.filter(r=>r&&r.name&&r.score!==undefined).sort((a,b)=>b.score-a.score);
    if(results.length===0){
      listEl.innerHTML = '<div class="empty">유효한 응시 기록이 없습니다.</div>';
      statsEl.innerHTML = '';
      return;
    }
    const avg = (results.reduce((s,r)=>s+(Number(r.score)||0),0)/results.length).toFixed(1);
    statsEl.innerHTML = `
      <div class="stat"><div class="stat-n">${results.length}</div><div class="stat-l">응시 인원</div></div>
      <div class="stat"><div class="stat-n">${avg}</div><div class="stat-l">평균</div></div>
      <div class="stat"><div class="stat-n">${results[0].score||0}</div><div class="stat-l">최고점</div></div>`;

    listEl.innerHTML = '';
    results.forEach((r,i)=>{
      const gc = r.pct>=92?'s':r.pct>=80?'a':r.pct>=60?'b':'c';
      const gl = r.pct>=92?'S':r.pct>=80?'A':r.pct>=60?'B':'C';
      let wrongHtml = '';
      if(r.answers && Array.isArray(r.answers)){
        const wrongs = [];
        r.answers.forEach((ansIdx,idx)=>{
          if(!Q[idx]) return;
          if(ansIdx !== Q[idx].a){
            const stuAns = ansIdx;
            const corAnsStr = Q[idx].c[Q[idx].a].split(' ')[0];
            const stuAnsStr = ansIdx>=0?Q[idx].c[ansIdx].split(' ')[0]:'미응답';
            const choicesHtml = Q[idx].c.map((cText,cIdx)=>{
              let cClass = 'detail-c';
              if(cIdx===Q[idx].a) cClass += ' is-ans';
              else if(cIdx===stuAns) cClass += ' is-wrong';
              return `<div class="${cClass}">${cText}</div>`;
            }).join('');
            wrongs.push(`
              <div class="admin-wrong-item toggle-btn" onclick="document.getElementById('adm-det-${i}-${idx}').classList.toggle('active');event.stopPropagation();">
                <div style="display:flex;gap:10px;align-items:flex-start;">
                  <div class="admin-wrong-point">${idx+1}번</div>
                  <div class="admin-wrong-desc">
                    <div style="margin-bottom:4px;"><span style="font-weight:600;color:var(--text);">${Q[idx].p}</span> <span class="click-hint">(클릭하여 지문 보기 ▾)</span></div>
                    학생: <span class="admin-wrong-ans">${stuAnsStr}</span> → 정답: <span class="admin-correct-ans">${corAnsStr}</span>
                    <div class="detail-box" id="adm-det-${i}-${idx}" onclick="event.stopPropagation()">
                      <div class="detail-q">${Q[idx].q}</div>
                      <div style="display:flex;flex-direction:column;gap:4px;">${choicesHtml}</div>
                      ${Q[idx].e?`<div class="detail-exp"><div class="detail-exp-label">💡 해설</div>${Q[idx].e}</div>`:''}
                    </div>
                  </div>
                </div>
              </div>`);
          }
        });
        wrongHtml = wrongs.length>0
          ? `<div class="admin-details" id="detail-${i}"><div style="font-size:12px;font-weight:700;margin-bottom:12px;color:var(--text);">[틀린 문항 원문 확인]</div>${wrongs.join('')}</div>`
          : `<div class="admin-details" id="detail-${i}"><div style="color:var(--orange);font-weight:600;text-align:center;">모든 문제를 완벽하게 맞혔습니다! 🎉</div></div>`;
      } else {
        wrongHtml = `<div class="admin-details" id="detail-${i}"><div style="color:var(--text-muted);text-align:center;font-size:12px">상세 데이터가 없습니다.</div></div>`;
      }
      const rowWrap = document.createElement('div');
      rowWrap.className = 'admin-row-wrap';
      rowWrap.innerHTML = `
        <div class="admin-row" onclick="document.getElementById('detail-${i}').classList.toggle('active')">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:12px;color:var(--text-muted);min-width:20px">${i+1}</span>
            <div>
              <div class="admin-name">${r.name} <span style="font-size:11px;color:#9ca3af;font-weight:normal;">(클릭)</span></div>
              <div class="admin-date">${r.date||''}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center">
            <span class="admin-score">${r.score!==undefined?r.score:'?'}점</span>
            <span class="admin-rank rank-${gc}">${gl}</span>
            <span style="color:#d1d5db;margin-left:8px;font-size:18px;">▾</span>
          </div>
        </div>
        ${wrongHtml}`;
      listEl.appendChild(rowWrap);
    });
  }catch(e){
    listEl.innerHTML = '<div class="empty">데이터 불러오기 실패: '+e.message+'</div>';
  }
}

async function confirmClear(){
  const sel = document.getElementById('adm-ch').value;
  const ch = CHAPTERS[sel];
  if(!confirm(`[${ch.title}] 응시 기록을 모두 삭제하시겠습니까?`)) return;
  try{
    await fetch(FIREBASE_URL+ch.db, {method:'DELETE'});
    loadAdmin();
  }catch(e){alert('삭제 실패: '+e.message)}
}

// 초기 렌더링
renderGrid();
</script>
</body>
</html>
