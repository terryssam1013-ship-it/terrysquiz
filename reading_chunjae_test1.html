<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>본문 N제 변형 1~25 · New Ideas Bring Big Changes</title>
<style>
  :root{
    --orange:#d97706; --orange-d:#b45309; --orange-l:#fef3c7;
    --ink:#1f2937; --gray:#6b7280; --line:#e5e7eb; --bg:#fafaf9;
    --ok:#059669; --ok-bg:#ecfdf5; --no:#dc2626; --no-bg:#fef2f2;
    --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.7; padding:0 0 80px;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 16px}
  header{
    background:linear-gradient(135deg,var(--orange),var(--orange-d));
    color:#fff;padding:26px 16px 22px;text-align:center;margin-bottom:20px;
    box-shadow:0 2px 10px rgba(180,83,9,.25)
  }
  header h1{font-size:1.25rem;font-weight:800;letter-spacing:-.3px}
  header p{font-size:.85rem;opacity:.92;margin-top:4px}
  .bar{
    position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);
    backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
    padding:10px 16px;display:flex;align-items:center;gap:12px;
  }
  .bar .prog{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar .prog>i{display:block;height:100%;width:0;background:var(--orange);transition:width .3s}
  .bar .count{font-size:.82rem;color:var(--gray);font-weight:600;white-space:nowrap}
  .name-row{margin:0 0 18px;display:flex;gap:8px;align-items:center}
  .name-row label{font-weight:700;font-size:.9rem;white-space:nowrap}
  .name-row input{
    flex:1;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:.95rem
  }
  .q{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px 18px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)
  }
  .q .num{
    display:inline-block;background:var(--orange-l);color:var(--orange-d);
    font-weight:800;font-size:.78rem;padding:3px 10px;border-radius:99px;margin-bottom:10px
  }
  .q .ask{font-weight:700;font-size:.98rem;margin-bottom:12px;word-break:keep-all}
  .q .title{font-weight:700;color:var(--orange-d);font-size:.92rem;margin-bottom:6px}
  .passage{
    background:#fbfbf9;border:1px solid var(--line);border-left:3px solid var(--orange);
    border-radius:8px;padding:12px 14px;font-size:.92rem;white-space:pre-wrap;
    margin-bottom:12px;color:#374151
  }
  .given{
    background:var(--orange-l);border-radius:8px;padding:10px 14px;font-size:.92rem;
    margin-bottom:12px;font-style:italic
  }
  .summary{
    background:#f3f4f6;border-radius:8px;padding:10px 14px;font-size:.92rem;
    margin:10px 0;text-align:center;font-weight:500
  }
  .extra{font-size:.88rem;color:#4b5563;background:#f9fafb;border-radius:8px;
    padding:10px 12px;margin-bottom:12px;white-space:pre-wrap}
  .choices{list-style:none;display:flex;flex-direction:column;gap:8px}
  .choices li{
    border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;
    font-size:.93rem;display:flex;gap:9px;align-items:flex-start;transition:.15s;background:#fff
  }
  .choices li:hover{border-color:var(--orange);background:#fffdf7}
  .choices li.sel{border-color:var(--orange);background:var(--orange-l);font-weight:600}
  .choices li .ci{
    flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--gray);
    display:grid;place-items:center;font-size:.78rem;font-weight:700;color:var(--gray)
  }
  .choices li.sel .ci{background:var(--orange);border-color:var(--orange);color:#fff}
  .sa-input{
    width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
    font-size:.95rem;font-family:inherit
  }
  .sa-input:focus{outline:none;border-color:var(--orange)}
  /* 채점 후 */
  .choices li.correct{border-color:var(--ok);background:var(--ok-bg)}
  .choices li.correct .ci{background:var(--ok);border-color:var(--ok);color:#fff}
  .choices li.wrong{border-color:var(--no);background:var(--no-bg)}
  .choices li.wrong .ci{background:var(--no);border-color:var(--no);color:#fff}
  .verdict{margin-top:10px;font-weight:700;font-size:.88rem;display:flex;gap:6px;align-items:center}
  .verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}
  .expl{
    margin-top:10px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;
    padding:11px 13px;font-size:.88rem;color:#4b5563
  }
  .expl b{color:var(--orange-d)}
  .sa-answer{margin-top:8px;font-size:.9rem}
  .sa-answer .lab{font-weight:700;color:var(--ok)}
  .submit{
    display:block;width:100%;background:var(--orange);color:#fff;border:none;
    padding:15px;border-radius:14px;font-size:1.05rem;font-weight:800;cursor:pointer;
    margin-top:8px;box-shadow:0 3px 10px rgba(217,119,6,.3);transition:.15s
  }
  .submit:hover{background:var(--orange-d)}
  .submit:disabled{opacity:.5;cursor:not-allowed}
  .result{
    background:linear-gradient(135deg,var(--orange),var(--orange-d));color:#fff;
    border-radius:18px;padding:26px 20px;text-align:center;margin-bottom:18px;display:none
  }
  .result.show{display:block}
  .result .score{font-size:2.6rem;font-weight:900;line-height:1}
  .result .sub{opacity:.92;margin-top:8px;font-size:.95rem}
  .result .detail{font-size:.85rem;opacity:.85;margin-top:4px}
  .retry{
    background:#fff;color:var(--orange-d);border:none;padding:10px 22px;border-radius:99px;
    font-weight:700;cursor:pointer;margin-top:14px;font-size:.9rem
  }
  /* admin */
  .admin-toggle{
    position:fixed;bottom:16px;right:16px;z-index:50;background:#374151;color:#fff;
    border:none;width:48px;height:48px;border-radius:50%;font-size:1.1rem;cursor:pointer;
    box-shadow:0 3px 12px rgba(0,0,0,.3);opacity:.55
  }
  .admin-toggle:hover{opacity:1}
  .admin-panel{
    position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:none;
    padding:20px;overflow-y:auto
  }
  .admin-panel.show{display:block}
  .admin-box{
    max-width:720px;margin:0 auto;background:#fff;border-radius:16px;padding:20px;
  }
  .admin-box h2{font-size:1.1rem;margin-bottom:4px}
  .admin-box .hint{font-size:.82rem;color:var(--gray);margin-bottom:16px}
  .admin-q{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .admin-q .aq-num{font-weight:800;color:var(--orange-d);font-size:.85rem}
  .admin-q .aq-ask{font-size:.85rem;color:#4b5563;margin:4px 0 10px}
  .admin-q label{display:block;font-size:.8rem;font-weight:700;margin:8px 0 4px;color:#374151}
  .admin-q select,.admin-q textarea{
    width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;
    font-size:.88rem;font-family:inherit
  }
  .admin-q textarea{min-height:60px;resize:vertical}
  .admin-actions{display:flex;gap:10px;margin-top:16px;position:sticky;bottom:0;background:#fff;padding-top:10px}
  .admin-actions button{flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;cursor:pointer;font-size:.92rem}
  .btn-save{background:var(--orange);color:#fff}
  .btn-close{background:var(--line);color:#374151}
  .edited-flag{font-size:.72rem;color:var(--orange);font-weight:700}
</style>
</head>

<header>
  <h1>본문 N제 변형 1~25</h1>
  <p>3. New Ideas Bring Big Changes · 중2 영어</p>

<div class="wrap">

    <div id="adminList"></div>
    <div class="admin-actions">
      <button class="btn-close" id="adminClose">닫기</button>
      <button class="btn-save" id="adminSave">저장</button>
    </div>
  </div>
</div>

// ── admin 수정본(override) 적용 ──
// 저장 위치: 현재는 메모리(세션). Firebase 연결 시 question_overrides/ 경로로 교체.
var OVERRIDES = {};   // { id: { a:정답, expl:해설 } }

function applyOverrides(){
  QUESTIONS.forEach(function(q){
    var ov = OVERRIDES[q.id];
    if(ov){
      if(ov.a !== undefined && ov.a !== null && ov.a !== '') {
        if(q.type==='mc') q.a = parseInt(ov.a,10);
        else q.a = ov.a;
      }
      if(ov.expl !== undefined && ov.expl !== '') q.expl = ov.expl;
    }
  });
}

// 정규화: 단답 채점용
function norm(s){
  return (s||'').toString().trim().toLowerCase()
    .replace(/\s+/g,' ')
    .replace(/[.\u3002]+$/,'')   // 끝의 마침표 제거
    .replace(/[''`]/g,"'");
}

var PASSAGE_REF = PASSAGES;
var graded = false;
var answers = {};   // id -> 선택값(mc:index, sa:문자열)

function passageHTML(q){
  var html='';
  if(q.title) html += '<div class="title">'+escapeHtml(q.title)+'</div>';
  if(q.given) html += '<div class="given">'+escapeHtml(q.given)+'</div>';
  var ptext = q.passage ? PASSAGE_REF[q.passage] : (q.passage_text||'');
  if(ptext) html += '<div class="passage">'+escapeHtml(ptext)+'</div>';
  if(q.underline) html += '<div class="given">밑줄: '+escapeHtml(q.underline)+'</div>';
  if(q.extra) html += '<div class="extra">'+escapeHtml(q.extra)+'</div>';
  if(q.summary) html += '<div class="summary">'+escapeHtml(q.summary)+'</div>';
  return html;
}
function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(){
  var area = document.getElementById('quizArea');
  area.innerHTML = '';
  QUESTIONS.forEach(function(q){
    var div = document.createElement('div');
    div.className='q'; div.id='q'+q.id;
    var inner = '<span class="num">'+q.id+'번 · '+(q.type==='mc'?'객관식':'서답형')+'</span>';
    inner += '<div class="ask">'+escapeHtml(q.q)+'</div>';
    inner += passageHTML(q);
    if(q.type==='mc'){
      inner += '<ul class="choices" data-qid="'+q.id+'">';
      q.c.forEach(function(c,i){
        var mark = ['①','②','③','④','⑤'][i] || (i+1);
        inner += '<li data-idx="'+i+'"><span class="ci">'+mark+'</span><span>'+escapeHtml(c)+'</span></li>';
      });
      inner += '</ul>';
    } else {
      inner += '<input class="sa-input" data-qid="'+q.id+'" placeholder="답을 입력하세요" autocomplete="off">';
    }
    inner += '<div class="fb" id="fb'+q.id+'"></div>';
    div.innerHTML = inner;
    area.appendChild(div);
  });
  // 이벤트
  area.querySelectorAll('.choices li').forEach(function(li){
    li.addEventListener('click', function(){
      if(graded) return;
      var ul = li.parentElement;
      var qid = parseInt(ul.dataset.qid,10);
      ul.querySelectorAll('li').forEach(function(x){x.classList.remove('sel')});
      li.classList.add('sel');
      answers[qid] = parseInt(li.dataset.idx,10);
      updateProgress();
    });
  });
  area.querySelectorAll('.sa-input').forEach(function(inp){
    inp.addEventListener('input', function(){
      if(graded) return;
      var qid = parseInt(inp.dataset.qid,10);
      answers[qid] = inp.value;
      updateProgress();
    });
  });
}

function updateProgress(){
  var done = QUESTIONS.filter(function(q){
    var v = answers[q.id];
    return v !== undefined && v !== null && v !== '';
  }).length;
  document.getElementById('count').textContent = done+' / '+QUESTIONS.length;
  document.getElementById('progBar').style.width = (done/QUESTIONS.length*100)+'%';
}

function checkSA(q, val){
  var n = norm(val);
  if(norm(q.a) === n) return true;
  if(q.accepts){
    for(var i=0;i<q.accepts.length;i++){ if(norm(q.accepts[i])===n) return true; }
  }
  return false;
}

function grade(){
  graded = true;
  var per = 100/QUESTIONS.length;
  var correct = 0;
  QUESTIONS.forEach(function(q){
    var fb = document.getElementById('fb'+q.id);
    var isOK = false;
    if(q.type==='mc'){
      var ul = document.querySelector('.choices[data-qid="'+q.id+'"]');
      var chosen = answers[q.id];
      ul.querySelectorAll('li').forEach(function(li){
        var idx = parseInt(li.dataset.idx,10);
        li.style.cursor='default';
        if(idx===q.a) li.classList.add('correct');
        if(idx===chosen && idx!==q.a) li.classList.add('wrong');
      });
      isOK = (chosen===q.a);
    } else {
      var inp = document.querySelector('.sa-input[data-qid="'+q.id+'"]');
      inp.disabled = true;
      isOK = checkSA(q, answers[q.id]||'');
      inp.style.borderColor = isOK ? 'var(--ok)' : 'var(--no)';
      inp.style.background = isOK ? 'var(--ok-bg)' : 'var(--no-bg)';
    }
    if(isOK) correct++;
    var v = '<div class="verdict '+(isOK?'ok':'no')+'">'+(isOK?'✓ 정답':'✗ 오답')+'</div>';
    if(q.type==='sa'){
      v += '<div class="sa-answer"><span class="lab">모범답안:</span> '+escapeHtml(q.a)+'</div>';
    }
    if(q.expl){
      v += '<div class="expl"><b>해설</b> · '+escapeHtml(q.expl)+'</div>';
    }
    fb.innerHTML = v;
  });
  var score = Math.round(correct*per);
  var res = document.getElementById('result');
  res.classList.add('show');
  document.getElementById('scoreNum').textContent = score+'점';
  document.getElementById('scoreSub').textContent =
    (document.getElementById('studentName').value||'학생')+' · '+correct+'/'+QUESTIONS.length+' 정답';
  document.getElementById('scoreDetail').textContent = '오답 문항의 해설을 아래에서 확인하세요';
  document.getElementById('submitBtn').disabled = true;
  res.scrollIntoView({behavior:'smooth'});
  // (Firebase 연결 시: 여기서 점수를 scores/ 경로에 저장)
}

document.getElementById('submitBtn').addEventListener('click', function(){
  var unanswered = QUESTIONS.filter(function(q){
    var v=answers[q.id]; return v===undefined||v===null||v==='';
  });
  if(unanswered.length>0){
    if(!confirm(unanswered.length+'개 문항이 비어 있습니다. 그래도 채점할까요?')) return;
  }
  grade();
});

// ── admin ──
function buildAdmin(){
  var list = document.getElementById('adminList');
  list.innerHTML='';
  QUESTIONS.forEach(function(q){
    var d=document.createElement('div'); d.className='admin-q';
    var h = '<div class="aq-num">'+q.id+'번 '+(q.type==='mc'?'(객관식)':'(서답형)')+'</div>';
    h += '<div class="aq-ask">'+escapeHtml(q.q)+'</div>';
    if(q.type==='mc'){
      h += '<label>정답</label><select data-ed-a="'+q.id+'">';
      q.c.forEach(function(c,i){
        var mark=['①','②','③','④','⑤'][i]||(i+1);
        h += '<option value="'+i+'"'+(i===q.a?' selected':'')+'>'+mark+' '+escapeHtml(c.slice(0,40))+'</option>';
      });
      h += '</select>';
    } else {
      h += '<label>정답(모범답안)</label><textarea data-ed-a="'+q.id+'">'+escapeHtml(q.a)+'</textarea>';
    }
    h += '<label>오답해설</label><textarea data-ed-expl="'+q.id+'">'+escapeHtml(q.expl||'')+'</textarea>';
    d.innerHTML=h;
    list.appendChild(d);
  });
}
document.getElementById('adminToggle').addEventListener('click', function(){
  buildAdmin();
  document.getElementById('adminPanel').classList.add('show');
});
document.getElementById('adminClose').addEventListener('click', function(){
  document.getElementById('adminPanel').classList.remove('show');
});
document.getElementById('adminSave').addEventListener('click', function(){
  document.querySelectorAll('[data-ed-a]').forEach(function(el){
    var id=parseInt(el.dataset.edA,10);
    OVERRIDES[id]=OVERRIDES[id]||{};
    OVERRIDES[id].a = el.value;
  });
  document.querySelectorAll('[data-ed-expl]').forEach(function(el){
    var id=parseInt(el.dataset.edExpl,10);
    OVERRIDES[id]=OVERRIDES[id]||{};
    OVERRIDES[id].expl = el.value;
  });
  applyOverrides();
  document.getElementById('adminPanel').classList.remove('show');
  alert('저장되었습니다. 수정된 정답·해설이 채점에 반영됩니다.');
});

// init
applyOverrides();
render();
updateProgress();
</script>
